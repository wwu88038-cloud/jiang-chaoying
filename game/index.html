    background:rgba(0,0,0,.4);color:#fff;font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center}

</head>
<body>
<div id="wrap"><canvas id="game" width="260" height="420"></canvas></div>
<button id="sound" aria-label="开关声音">🔊</button>
<script>
(function () {
  'use strict';

  // ======== 在线排行配置（填了才会启用在线模式）========
  var CONFIG = {
    SUPABASE_URL: 'https://gmbxajmnoovqspsifoij.supabase.co',
    SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtYnhham1ub292cXNwc2lmb2lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0NjgxOTEsImV4cCI6MjExMTA0NDE5MX0.RDQY5VISLZ-jtx7ePg9SXju2mji5D8OXciGMOEoxnu0'
  };

  // ================= 常量 =================
  var W = 260, H = 420, GROUND = 338, PX = 58, PS = 18;
  var GRAV = 2200, JUMP = -775, JUMP2 = -695, CUT = -320, STOMP_BOUNCE = -570;
  var BOSS_FIRST = 700, BOSS_GAP = 1700;

  var cvs = document.getElementById('game');
  var ctx = cvs.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  var PAL = {
    player: '#ff8a3d', playerD: '#df6a20', playerL: '#ffb37a',
    eye: '#2a1a12', mouth: '#7a2f14',
    stone: '#a7b0ba', stoneD: '#78828d', stoneT: '#c6ced6',
    wood: '#c08046', woodD: '#94602f', woodT: '#dda76c',
    coin: '#ffd34a', coinD: '#e0a91f',
    slime: '#7ee06a', slimeD: '#4fb843', slimeT: '#a9f293',
    walker: '#ff9d5c', walkerD: '#d96f2e', walkerT: '#ffc08d',
    flyer: '#b98cff', flyerD: '#8a5fe0', flyerE: '#ffe36b',
    boss: '#8b4be0', bossD: '#5a2a96', bossT: '#b57cff',
    horn: '#ffd34a', bossEye: '#ff4d6d', bossMouth: '#240a38',
    fire: '#ff7a45', fireT: '#ffd08a',
    star: '#ffe36b', magnet: '#5cc8ff', dbl: '#ff7ad9',
    white: '#ffffff', dim: 'rgba(255,255,255,.72)'
  };

  var SKY_STOPS = [
    { t: 0.00, a: '#6fc6ff', b: '#c9f0ff', sun: '#fff2b8', hill: '#7fd35e', hill2: '#5cb440', far: '#8ed7f3', far2: '#74c3e6' },
    { t: 0.34, a: '#f5a45b', b: '#ffe1a6', sun: '#fff0a0', hill: '#71c255', hill2: '#4f9e3a', far: '#efb27c', far2: '#d8935f' },
    { t: 0.55, a: '#2a2e68', b: '#6b4b7c', sun: '#ffe9a8', hill: '#3d6b47', hill2: '#2f5338', far: '#3b3f74', far2: '#2e3260' },
    { t: 0.80, a: '#101733', b: '#26305a', sun: '#e2e8ff', hill: '#2b4a3a', hill2: '#223a2e', far: '#1e2547', far2: '#181e3a' },
    { t: 1.00, a: '#6fc6ff', b: '#c9f0ff', sun: '#fff2b8', hill: '#7fd35e', hill2: '#5cb440', far: '#8ed7f3', far2: '#74c3e6' }
  ];
  function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  function mix(a, b, k) {
    var A = hex2rgb(a), B = hex2rgb(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * k) + ',' + Math.round(A[1] + (B[1] - A[1]) * k) + ',' + Math.round(A[2] + (B[2] - A[2]) * k) + ')';
  }
  function skyAt(cycle) {
    var stops = SKY_STOPS, i = 0;
    while (i < stops.length - 2 && cycle > stops[i + 1].t) i++;
    var A = stops[i], B = stops[i + 1];
    var k = Math.max(0, Math.min(1, (cycle - A.t) / (B.t - A.t || 1)));
    return {
      a: mix(A.a, B.a, k), b: mix(A.b, B.b, k), sun: mix(A.sun, B.sun, k),
      hill: mix(A.hill, B.hill, k), hill2: mix(A.hill2, B.hill2, k),
      far: mix(A.far, B.far, k), far2: mix(A.far2, B.far2, k)
    };
  }

  // ================= 存档 =================
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var best = parseInt(lsGet('blockjump.best') || '0', 10) || 0, prevBest = best;
  var LB = [];
  try { LB = JSON.parse(lsGet('blockjump.lb') || '[]') || []; } catch (e) { LB = []; }
  var playerName = lsGet('blockjump.name') || '';
  if (!playerName) {
    var NAMES = ['方块侠', '夜行喵', '像素客', '跳跃王', '小小勇者', '霓虹兔', '霓虹猫', '方块旅人'];
    playerName = NAMES[Math.floor(Math.random() * NAMES.length)] + Math.floor(100 + Math.random() * 900);
    lsSet('blockjump.name', playerName);
  }
  var ONLINE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
  var onlineRows = [], onlineState = 'idle', submitT = 0;

  // ================= 声音 =================
  var ac = null, soundOn = true, sndQ = [];
  var musicStep = 0, musicNext = 0;
  var soundBtn = document.getElementById('sound');
  function AC() {
    if (!ac) {
      try {
        var C = window.AudioContext || window.webkitAudioContext;
        if (C) ac = new C();
      } catch (e) {}
    }
    return ac;
  }
  function beep(freq, dur, type, vol) {
    if (!soundOn) return;
    var a = AC(); if (!a) return;
    try {
      if (a.state === 'suspended' && a.resume) a.resume();
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.045, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function slideSound(f1, f2, dur, type, vol) {
    if (!soundOn) return;
    var a = AC(); if (!a) return;
    try {
      var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
      o.type = type || 'sawtooth';
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol || 0.06, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  // 芯片音乐（纯 WebAudio 合成，无音频文件）
  var BASS = [0, 0, 7, 7, 5, 5, 3, 3];
  var LEAD = [12, 15, 19, 15, 12, 17, 19, 22, 12, 15, 19, 15, 10, 12, 15, 17];
  function note(freq, at, dur, type, vol) {
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(vol, at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(at); o.stop(at + dur + 0.02);
    } catch (e) {}
  }
  function musicTick() {
    if (!soundOn || !ac || state !== 'play') return;
    var now = ac.currentTime;
    if (musicNext < now) musicNext = now + 0.06;
    var steps = 0;
    while (musicNext < now + 0.3 && steps++ < 8) {
      var s = musicStep % 16;
      var bassN = BASS[(musicStep >> 1) % 8];
      note(55 * Math.pow(2, bassN / 12), musicNext, 0.24, 'square', 0.030);
      if (s % 2 === 0) note(220 * Math.pow(2, LEAD[s] / 12), musicNext, 0.13, 'triangle', 0.022);
      if (s % 4 === 0) note(880, musicNext, 0.03, 'square', 0.008);
      musicStep++; musicNext += 0.145;
    }
  }
  soundBtn.addEventListener('click', function (ev) {
    ev.stopPropagation();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    musicStep = 0;
    if (soundOn) beep(660, 0.08);
  });

  // ================= 状态 =================
  var state = 'menu';
  var camX = 0, speed = 205, dist = 0, baseScore = 0, bonusScore = 0, score = 0;
  var coinsGot = 0, kills = 0, combo = 0, maxCombo = 0, comboUntil = 0;
  var shake = 0, flash = 0, freeze = 0, time = 0, nextX = 0, last = 0, dustT = 0;
  var gaps = [], obs = [], mobs = [], projs = [], pickups = [], coinList = [], parts = [], texts = [], rings = [], trail = [];
  var stars = [];
  var overAt = 0, toastTimer = 0, toastMsg = '', deadReason = '';
  var inv = 0, magnet = 0, dbl = 0;
  var boss = null, nextBossAt = BOSS_FIRST, arena = false;
  var p = { y: GROUND, vy: 0, jumps: 0, rot: 0, squash: 1, onGround: true, spin: 0, onBlock: false };
  var showBoard = false, boardTab = 0, thisRank = 0, highlightScore = -1;

  for (var si = 0; si < 46; si++) stars.push({ x: (si * 73.7) % W, y: (si * 41.3) % 240, s: (si % 3 === 0) ? 2 : 1, ph: si * 0.7 });

  function reset() {
    camX = 0; speed = 205; dist = 0; baseScore = 0; bonusScore = 0; score = 0;
    coinsGot = 0; kills = 0; combo = 0; maxCombo = 0; comboUntil = 0;
    shake = 0; flash = 0; freeze = 0; time = 0; nextX = W + 150; dustT = 0;
    gaps = []; obs = []; mobs = []; projs = []; pickups = [];
    coinList = []; parts = []; texts = []; rings = []; trail = [];
    inv = 0; magnet = 0; dbl = 0;
    boss = null; nextBossAt = BOSS_FIRST; arena = false;
    showBoard = false; boardTab = 0; thisRank = 0; highlightScore = -1;
    deadReason = ''; toastTimer = 0; toastMsg = '';
    p = { y: GROUND, vy: 0, jumps: 0, rot: 0, squash: 1, onGround: true, spin: 0, onBlock: false };
  }
  function start() {
    reset(); prevBest = best; state = 'play';
    musicStep = 0; musicNext = 0;
    beep(520, 0.07); beep(780, 0.07, 'square', 0.03);
  }

  // ================= 工具 =================
  function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
  function txt(s, x, y, size, color, align, bold) {
    ctx.font = (bold ? 'bold ' : '') + size + 'px "Courier New",monospace';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = color;
    ctx.fillText(s, x | 0, y | 0);
  }
  function burst(x, y, color, n, pow) {
    pow = pow || 1;
    for (var i = 0; i < n; i++) {
      parts.push({
        x: x, y: y, vx: (Math.random() - 0.5) * 120 * pow, vy: -Math.random() * 130 * pow,
        life: 0.3 + Math.random() * 0.5, max: 0.8, color: color,
        size: 2 + (Math.random() < 0.5 ? 0 : 2), g: 700
      });
    }
  }
  function sparkle(x, y, color) {
    for (var i = 0; i < 6; i++) {
      var a = Math.random() * Math.PI * 2;
      parts.push({ x: x, y: y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90 - 30, life: 0.35, max: 0.35, color: color, size: 2, g: 120 });
    }
  }
  function floatText(s, x, y, color, size) {
    texts.push({ s: s, x: x, y: y, vy: -46, life: 0.8, max: 0.8, color: color, size: size || 9 });
  }
  function ring(x, y, color) { rings.push({ x: x, y: y, r: 4, color: color, life: 0.32, max: 0.32 }); }
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function toast(m) { toastMsg = m; toastTimer = 1.5; }
  function addBonus(n) { bonusScore += n * (dbl > 0 ? 2 : 1); }

  // ================= 地面 =================
  function groundAt(wx) {
    for (var i = 0; i < gaps.length; i++) if (wx > gaps[i].x && wx < gaps[i].x + gaps[i].w) return false;
    return true;
  }

  // ================= 生成 =================
  function spawnAhead() {
    if (boss) return; // Boss 期间暂停常规生成
    var edge = camX + W + 150;
    var lvl = Math.min(1, score / 900);
    var baseGap = Math.max(150, speed * 0.95);
    var guard = 0;
    while (nextX < edge && guard++ < 24) {
      var r = Math.random();
      if (r < 0.20 && score > 140) {
        var gw = 32 + Math.random() * (14 + lvl * 24);
        gaps.push({ x: nextX, w: gw });
        nextX += gw + baseGap + Math.random() * 60;
      } else if (r < 0.36) {
        var big = Math.random() < 0.3 + lvl * 0.15;
        var tall = big && Math.random() < 0.6;
        var wide = big && !tall;
        var h = tall ? 36 : 18, w = wide ? 36 : 18;
        obs.push({ x: nextX, y: GROUND - h, w: w, h: h, kind: Math.random() < 0.5 ? 'stone' : 'wood' });
        nextX += w + baseGap + Math.random() * 60;
      } else if (r < 0.64) {
        var roll = Math.random();
        var kind = roll < 0.45 ? 'slime' : (roll < 0.82 ? 'walker' : 'flyer');
        if (kind === 'flyer') {
          mobs.push({ kind: 'flyer', x: nextX, baseY: GROUND - 74 - Math.random() * 16, w: 16, h: 12, t: Math.random() * 6, phase: Math.random() * 6, vx: 0, dead: false, deadT: 0 });
          nextX += 60 + baseGap * 1.05 + Math.random() * 40;
        } else {
          mobs.push({ kind: kind, x: nextX, baseY: GROUND, w: kind === 'slime' ? 16 : 18, h: kind === 'slime' ? 14 : 16, t: Math.random() * 6, phase: Math.random() * 6, vx: kind === 'walker' ? -(0.28 + Math.random() * 0.26) : 0, dead: false, deadT: 0 });
          nextX += (kind === 'walker' ? 110 : 24) + baseGap + Math.random() * 60;
        }
      } else if (r < 0.72) {
        var kinds = ['star', 'magnet', 'dbl'];
        pickups.push({ x: nextX, y: GROUND - 52 - Math.random() * 22, kind: kinds[Math.floor(Math.random() * 3)], t: Math.random() * 6, got: false });
        nextX += 60 + baseGap * 0.75 + Math.random() * 40;
      } else {
        var n = 3 + Math.floor(Math.random() * 3);
        for (var i = 0; i < n; i++) {
          var t2 = (i + 1) / (n + 1);
          coinList.push({ x: nextX + i * 17, y: GROUND - 26 - Math.sin(t2 * Math.PI) * 32, got: false });
        }
        nextX += n * 17 + baseGap * 0.8 + Math.random() * 40;
      }
    }
    var cut = camX - 140;
    if (gaps.length && gaps[0].x + gaps[0].w < cut) gaps.shift();
    while (obs.length && obs[0].x + obs[0].w < cut) obs.shift();
    while (coinList.length && coinList[0].x + 16 < cut) coinList.shift();
    while (pickups.length && pickups[0].x + 20 < cut) pickups.shift();
    while (mobs.length && mobs[0].x + 40 < cut) mobs.shift();
  }

  function spawnBoss() {
    boss = {
      x: camX + W + 100, y: GROUND - 54, w: 46, h: 54, hp: 3, maxHp: 3,
      t: 0, shootT: 1.4, hitCd: 0, hitFlash: 0, dying: 0, stun: 0
    };
    arena = true;
    // 清场：打架的时候不要别的障碍
    gaps = []; obs = []; mobs = []; coinList = []; pickups = []; projs = [];
    nextX = camX + W + 160;
    flash = 0.35; shake = 9;
    slideSound(180, 70, 0.5, 'sawtooth', 0.08);
    floatText('⚠ BOSS 来了！', W / 2, 90, '#ff4d6d', 12);
    toast('跳起来踩它头上！');
    vibrate([30, 60, 30]);
  }

  // ================= 几何 =================
  function mobRect(m) {
    if (m.kind === 'slime') {
      var hop = Math.abs(Math.sin(m.t * 3.4)) * 15;
      return { x: m.x, y: m.baseY - hop - m.h, w: m.w, h: m.h, hop: hop };
    }
    if (m.kind === 'flyer') {
      var fy = m.baseY + Math.sin(m.t * 2.6 + m.phase) * 9;
      return { x: m.x, y: fy, w: m.w, h: m.h };
    }
    return { x: m.x, y: m.baseY - m.h, w: m.w, h: m.h };
  }
  function bossRect(b) { return { x: b.x, y: b.y, w: b.w, h: b.h }; }

  // ================= 结束 =================
  function die(reason) {
    if (state !== 'play') return;
    deadReason = reason;
    state = 'over';
    overAt = time;
    shake = 14; flash = 0.5; freeze = 0.14;
    if (reason === 'boss' || reason === 'fire') slideSound(300, 60, 0.5, 'sawtooth', 0.08);
    else if (reason === 'fall') slideSound(600, 90, 0.4);
    else beep(150, 0.3, 'sawtooth', 0.07);
    vibrate(50);
    burst(PX + 9, p.y - 9, '#ffffff', 10, 1.4);
    burst(PX + 9, p.y - 9, PAL.player, 14, 1.7);
    ring(PX + 9, p.y - 9, 'rgba(255,255,255,.9)');
    if (score > best) best = score;
    lsSet('blockjump.best', String(best));
    saveLocalScore();
    submitOnline();
  }

  function saveLocalScore() {
    var entry = {
      name: playerName, score: score, kills: kills, coins: coinsGot, combo: maxCombo,
      d: new Date().toISOString().slice(5, 10)
    };
    LB.push(entry);
    LB.sort(function (a, b) { return b.score - a.score; });
    LB = LB.slice(0, 10);
    var idx = LB.indexOf(entry);
    thisRank = idx >= 0 ? idx + 1 : 0;
    highlightScore = score;
    lsSet('blockjump.lb', JSON.stringify(LB));
  }

  // ================= 在线排行（Supabase）=================
  function sbHeaders() {
    return {
      'apikey': CONFIG.SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    };
  }
  function submitOnline() {
    if (!ONLINE || typeof fetch !== 'function') { onlineState = ONLINE ? 'error' : 'idle'; return; }
    if (time - submitT < 3) return;
    submitT = time;
    var body = [{
      name: playerName, score: Math.floor(score), kills: kills,
      coins: coinsGot, combo: maxCombo
    }];
    try {
      fetch(CONFIG.SUPABASE_URL + '/rest/v1/scores', {
        method: 'POST',
        headers: Object.assign({ 'Prefer': 'return=minimal' }, sbHeaders()),
        body: JSON.stringify(body)
      }).then(function (r) {
        if (r.status >= 200 && r.status < 300) { onlineState = 'ok'; }
        else { onlineState = 'error'; }
      }, function () { onlineState = 'error'; });
    } catch (e) { onlineState = 'error'; }
  }
  function loadOnline() {
    if (!ONLINE || typeof fetch !== 'function') { onlineState = 'off'; return; }
    onlineState = 'loading';
    try {
      fetch(CONFIG.SUPABASE_URL + '/rest/v1/scores?select=name,score,kills,coins,combo,created_at&order=score.desc&limit=20', { headers: sbHeaders() })
        .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
        .then(function (rows) { onlineRows = rows || []; onlineState = 'ok'; })
        .catch(function () { onlineState = 'error'; });
    } catch (e) { onlineState = 'error'; }
  }

  // ================= 输入 =================
  function gameCoords(ev) {
    var r = cvs.getBoundingClientRect();
    var scale = Math.min(r.width / W, r.height / H);
    var ox = (r.width - W * scale) / 2, oy = (r.height - H * scale) / 2;
    return { x: (ev.clientX - r.left - ox) / scale, y: (ev.clientY - r.top - oy) / scale };
  }
  var BTN_START = { x: 52, y: 250, w: 156, h: 34 };
  var BTN_MENU_LB = { x: 70, y: 292, w: 120, h: 26 };
  var BTN_RETRY = { x: 32, y: 222, w: 196, h: 34 };
  var BTN_SHARE = { x: 32, y: 262, w: 94, h: 28 };
  var BTN_LB = { x: 126, y: 262, w: 102, h: 28 };
  var BTN_TAB_LOCAL = { x: 40, y: 92, w: 86, h: 22 };
  var BTN_TAB_ONLINE = { x: 134, y: 92, w: 86, h: 22 };
  var BTN_BOARD_CLOSE = { x: 70, y: 324, w: 120, h: 26 };

  function inside(r, q) { return q.x >= r.x && q.x <= r.x + r.w && q.y >= r.y && q.y <= r.y + r.h; }

  function shareScore() {
    var text = '我在《方块跳跃》拿了 ' + score + ' 分，最高连击 ×' + maxCombo + '、击杀 ' + kills + ' 只小怪，来试试？';
    try {
      if (navigator.share) { navigator.share({ title: '方块跳跃', text: text }).catch(function () {}); return; }
    } catch (e) {}
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('成绩已复制'); }, function () { toast('复制失败'); });
      } else toast('长按截图分享吧');
    } catch (e) { toast('长按截图分享吧'); }
  }

  function tap(ev) {
    var q = ev && ev.clientX !== undefined ? gameCoords(ev) : null;
    if (state === 'menu') {
      if (q && inside(BTN_MENU_LB, q)) { showBoard = true; boardTab = 0; return; }
      start(); return;
    }
    if (state === 'over') {
      if (showBoard) {
        if (q && inside(BTN_BOARD_CLOSE, q)) { showBoard = false; return; }
        if (q && ONLINE && inside(BTN_TAB_LOCAL, q)) { boardTab = 0; return; }
        if (q && ONLINE && inside(BTN_TAB_ONLINE, q)) { boardTab = 1; loadOnline(); return; }
        return;
      }
      if (q && inside(BTN_LB, q)) { showBoard = true; boardTab = ONLINE ? 1 : 0; if (ONLINE) loadOnline(); return; }
      if (q && inside(BTN_SHARE, q)) { shareScore(); return; }
      var elapsed = time - overAt;
      if (q && inside(BTN_RETRY, q) && elapsed > 0.25) { start(); return; }
      if (elapsed > 0.6) start();
      return;
    }
    // playing
    if (p.onGround) {
      p.vy = JUMP; p.jumps = 1; p.onGround = false; p.squash = 0.78;
      beep(520, 0.06);
      ring(PX + 9, p.y, 'rgba(255,255,255,.5)');
      burst(PX + 9, p.y, 'rgba(255,255,255,.75)', 5, 0.6);
    } else if (p.jumps < 2) {
      p.vy = JUMP2; p.jumps = 2; p.spin = 0.12;
      beep(720, 0.06);
      ring(PX + 9, p.y - 8, 'rgba(255,227,107,.8)');
      sparkle(PX + 9, p.y - 8, PAL.coin);
    }
  }
  function release() { if (state === 'play' && p.vy < CUT) p.vy = CUT; }

  cvs.addEventListener('pointerdown', function (ev) { ev.preventDefault(); tap(ev); });
  cvs.addEventListener('pointerup', function (ev) { ev.preventDefault(); release(); });
  cvs.addEventListener('pointercancel', release);
  window.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space' || ev.code === 'ArrowUp' || ev.code === 'KeyW') { ev.preventDefault(); if (!ev.repeat) tap(null); }
    if (ev.code === 'KeyR' && state === 'over') start();
    if (ev.code === 'Escape' && showBoard) showBoard = false;
  });
  window.addEventListener('keyup', function (ev) {
    if (ev.code === 'Space' || ev.code === 'ArrowUp' || ev.code === 'KeyW') release();
  });
  document.addEventListener('visibilitychange', function () { last = 0; });

  // ================= 逻辑 =================
  function addCombo(n) {
    combo += n; comboUntil = time + 2.6;
    if (combo > maxCombo) maxCombo = combo;
  }

  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 46);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.8);
    if (toastTimer > 0) toastTimer = Math.max(0, toastTimer - dt);
    if (sndQ.length && time >= sndQ[0].at) { var sq = sndQ.shift(); beep(sq.f, sq.d, sq.t, sq.v); }
    musicTick();

    if (state !== 'play') {
      if (state === 'menu') camX += 34 * dt;
      stepParticles(dt); stepTexts(dt); stepRings(dt);
      return;
    }

    if (arena) {
      speed = 0;
    } else {
      speed = Math.min(520, 205 + dist * 0.04);
      camX += speed * dt;
      dist += speed * dt;
      baseScore += speed * dt / 10 * (dbl > 0 ? 2 : 1);
      score = Math.floor(baseScore) + bonusScore;
    }
    if (score > best) best = score;
    if (combo > 0 && time > comboUntil) combo = 0;
    if (inv > 0) inv = Math.max(0, inv - dt);
    if (magnet > 0) magnet = Math.max(0, magnet - dt);
    if (dbl > 0) dbl = Math.max(0, dbl - dt);

    // Boss 出现
    if (!boss && score >= nextBossAt) spawnBoss();

    // 玩家竖直
    var oldY = p.y;
    p.vy += GRAV * dt;
    p.y += p.vy * dt;
    p.rot += (p.onGround ? 0 : 5.2) * dt + p.spin;
    if (p.spin > 0) p.spin = Math.max(0, p.spin - dt * 6);
    var feet = camX + PX + 9, lx = camX + PX + 2, rx = camX + PX + 16;
    var support = Infinity;
    if (groundAt(feet) && groundAt(lx) && groundAt(rx)) support = GROUND;
    for (var b = 0; b < obs.length; b++) {
      var ob = obs[b];
      if (ob.x + ob.w > lx && ob.x < rx && p.vy >= 0 && oldY <= ob.y + 1 && ob.y < support) support = ob.y;
    }
    if (p.vy >= 0 && support < Infinity && p.y >= support) {
      if (!p.onGround && p.vy > 260) {
        p.squash = 0.72;
        burst(PX + 9, support, p.onBlock ? PAL.stoneD : '#c9a06a', 6, 0.7);
        ring(PX + 9, support, 'rgba(255,255,255,.45)');
        beep(240, 0.05, 'triangle', 0.03);
      }
      p.y = support; p.vy = 0; p.jumps = 0; p.onGround = true; p.rot = 0;
      p.onBlock = support < GROUND;
    } else { p.onGround = false; p.onBlock = false; }
    if (p.y > H + 80) die('fall');
    p.squash += (1 - p.squash) * Math.min(1, dt * 12);

    // 残影
    if (speed > 350 && Math.random() < 0.5) trail.push({ y: p.y, rot: p.rot, life: 0.22, max: 0.22 });
    for (var ti = trail.length - 1; ti >= 0; ti--) {
      trail[ti].life -= dt;
      if (trail[ti].life <= 0) trail.splice(ti, 1);
    }

    // 无敌撞击方块：撞碎
    for (var i = obs.length - 1; i >= 0; i--) {
      var o = obs[i];
      if (o.x + o.w > lx && o.x < rx && p.y > o.y + 5 && p.y - PS < o.y + o.h - 1) {
        if (inv > 0) {
          burst(o.x - camX + o.w / 2, o.y + o.h / 2, o.kind === 'stone' ? PAL.stone : PAL.wood, 10, 1.2);
          obs.splice(i, 1); addBonus(15); floatText('+15', o.x - camX, o.y, PAL.white, 8);
          beep(300, 0.06);
        } else { die('hit'); return; }
      }
    }

    // 小怪
    for (var mi = 0; mi < mobs.length; mi++) {
      var m = mobs[mi];
      m.t += dt;
      if (m.dead) { m.deadT += dt; continue; }
      if (m.kind === 'walker') m.x += m.vx * speed * dt * 0.5;
      var mr = mobRect(m);
      var sxr = mr.x - camX;
      if (sxr > W + 40 || sxr + mr.w < -40) continue;
      var overlapX = mr.x + mr.w > lx + 2 && mr.x < rx - 2;
      var overlapY = p.y > mr.y + 2 && p.y - PS < mr.y + mr.h - 2;
      if (overlapX && overlapY) {
        if (inv > 0) {
          m.dead = true; m.deadT = 0; kills++; addCombo(1);
          addBonus(30);
          burst(sxr + m.w / 2, mr.y + mr.h / 2, '#ff7ad9', 12, 1.5);
          floatText('+30', sxr + m.w / 2, mr.y - 4, '#ff9de0', 9);
          beep(700, 0.05);
        } else if (p.vy > 60 && p.y - PS < mr.y + mr.h * 0.75) {
          m.dead = true; m.deadT = 0; kills++; addCombo(1);
          var gain = 30 + Math.min(60, (combo - 1) * 10);
          addBonus(gain);
          p.vy = STOMP_BOUNCE; p.jumps = 1; p.onGround = false; p.squash = 0.7;
          var col = m.kind === 'slime' ? PAL.slime : (m.kind === 'walker' ? PAL.walker : PAL.flyer);
          burst(sxr + m.w / 2, mr.y + mr.h / 2, col, 12, 1.5);
          burst(sxr + m.w / 2, mr.y + mr.h / 2, '#ffffff', 5, 1);
          ring(sxr + m.w / 2, mr.y + mr.h / 2, 'rgba(255,255,255,.85)');
          floatText('+' + gain, sxr + m.w / 2, mr.y - 6, '#ffe36b', 10);
          if (combo > 1) floatText('连击 ×' + combo, PX + 9, p.y - 42, '#ff9de0', 9);
          beep(660, 0.05);
          sndQ.push({ at: time + 0.05, f: 990, d: 0.06, t: 'square', v: 0.03 });
          vibrate(18);
        } else { die('mob'); return; }
      }
    }

    // Boss
    if (boss) {
      var B = boss;
      B.t += dt;
      if (B.hitCd > 0) B.hitCd = Math.max(0, B.hitCd - dt);
      if (B.hitFlash > 0) B.hitFlash = Math.max(0, B.hitFlash - dt);
      if (B.dying > 0) {
        B.dying -= dt;
        if (B.dying <= 0) {
          boss = null;
          arena = false;
          nextBossAt = score + BOSS_GAP;
          nextX = camX + W + 160;
          addBonus(500);
          floatText('BOSS DOWN! +500', W / 2, 150, '#ffe36b', 13);
          flash = 0.5; shake = 12;
          for (var cb = 0; cb < 3; cb++) burst(B.x - camX + B.w / 2, B.y + B.h / 2, '#ffd34a', 18, 2);
          ring(B.x - camX + B.w / 2, B.y + B.h / 2, 'rgba(255,255,255,.9)');
          beep(520, 0.1); beep(780, 0.1); sndQ.push({ at: time + 0.12, f: 1040, d: 0.18, t: 'square', v: 0.05 });
        }
      } else {
        // 靠近玩家（被踩后会眩晕后退）
        if (B.stun > 0) {
          B.stun = Math.max(0, B.stun - dt);
        } else {
        B.x -= 74 * dt;
        // 射击
        B.shootT -= dt;
        if (B.shootT <= 0 && (B.x - camX) > 150) {   // 只在远处放火球，靠近时留给玩家踩头
          B.shootT = 1.7 + Math.random() * 0.8;
          projs.push({ x: B.x - 6, y: GROUND - 15, w: 11, h: 9, vx: -235, t: 0 });
          beep(320, 0.08, 'sawtooth', 0.04);
        }
        }
        var br = bossRect(B);
        var bOverlapX = br.x + br.w > lx + 2 && br.x < rx - 2;
        var bOverlapY = p.y > br.y + 2 && p.y - PS < br.y + br.h - 2;
        if (bOverlapX && bOverlapY) {
          if (inv > 0 && B.hitCd <= 0) {
            B.hp--; B.hitCd = 0.9; B.hitFlash = 0.3; B.stun = 0.45; B.x += 46; shake = 8;
            burst(br.x - camX + br.w / 2, br.y + br.h / 2, '#ff7ad9', 14, 1.6);
            floatText('-1 HP', br.x - camX + br.w / 2, br.y - 8, '#ff9de0', 10);
            beep(420, 0.08);
            if (B.hp <= 0) { B.dying = 0.7; }
          } else if (p.vy > 40 && p.y - PS < br.y + br.h * 0.55 && B.hitCd <= 0) {
            // 踩头
            B.hp--; B.hitCd = 0.9; B.hitFlash = 0.3; B.stun = 0.65; B.x += 76;
            p.vy = -600; p.jumps = 1; p.onGround = false; p.squash = 0.7;
            shake = 8;
            burst(br.x - camX + br.w / 2, br.y + 6, '#b57cff', 14, 1.6);
            floatText('-1 HP', br.x - camX + br.w / 2, br.y - 10, '#ffe36b', 11);
            beep(520, 0.06); sndQ.push({ at: time + 0.05, f: 880, d: 0.08, t: 'square', v: 0.04 });
            vibrate(25);
            if (B.hp <= 0) { B.dying = 0.7; }
          } else if (inv <= 0) { die('boss'); return; }
        }
        if (br.x + br.w < lx + 4) { die('boss'); return; }
      }
    }

    // Boss 火球
    for (var pi = projs.length - 1; pi >= 0; pi--) {
      var pr = projs[pi];
      pr.t += dt;
      pr.x += pr.vx * dt;
      if (pr.x + pr.w < camX - 30) { projs.splice(pi, 1); continue; }
      var prx = pr.x - camX;
      if (pr.x + pr.w > lx + 1 && pr.x < rx - 1 && p.y > pr.y + 3 && p.y - PS < pr.y + pr.h - 1) {
        if (inv > 0) {
          burst(prx + pr.w / 2, pr.y + pr.h / 2, PAL.fireT, 10, 1.2);
          projs.splice(pi, 1); addBonus(20); floatText('+20', prx, pr.y - 6, '#ffd08a', 8);
          beep(480, 0.05);
        } else { die('fire'); return; }
      }
    }

    // 金币（磁铁吸附）
    var pcx = PX + 9, pcy = p.y - 9;
    for (var j = 0; j < coinList.length; j++) {
      var c = coinList[j];
      if (c.got) continue;
      if (magnet > 0) {
        var dxw = (camX + pcx) - c.x, dyw = pcy - c.y;
        var dd = Math.sqrt(dxw * dxw + dyw * dyw);
        if (dd < 130 && dd > 1) {
          c.x += (dxw / dd) * 420 * dt;
          c.y += (dyw / dd) * 420 * dt;
        }
      }
      var csx = c.x - camX;
      if (Math.abs(csx - pcx) < 15 && Math.abs(c.y - pcy) < 16) {
        c.got = true; coinsGot++; addBonus(10); sparkle(csx, c.y, PAL.coin);
        floatText('+10', csx, c.y - 8, PAL.coin, 8);
        beep(940, 0.05); beep(1240, 0.05, 'square', 0.025);
      }
    }

    // 道具
    for (var qi = pickups.length - 1; qi >= 0; qi--) {
      var pu = pickups[qi];
      pu.t += dt;
      if (pu.got) continue;
      var pux = pu.x - camX;
      if (pux < -30) { pickups.splice(qi, 1); continue; }
      if (Math.abs(pux - pcx) < 16 && Math.abs(pu.y - pcy) < 18) {
        pu.got = true;
        if (pu.kind === 'star') { inv = 6; floatText('无敌 6s', pux, pu.y - 12, PAL.star, 10); }
        if (pu.kind === 'magnet') { magnet = 8; floatText('磁铁 8s', pux, pu.y - 12, PAL.magnet, 10); }
        if (pu.kind === 'dbl') { dbl = 10; floatText('双倍 10s', pux, pu.y - 12, PAL.dbl, 10); }
        burst(pux, pu.y, pu.kind === 'star' ? PAL.star : (pu.kind === 'magnet' ? PAL.magnet : PAL.dbl), 12, 1.3);
        ring(pux, pu.y, 'rgba(255,255,255,.8)');
        beep(880, 0.06); sndQ.push({ at: time + 0.06, f: 1320, d: 0.08, t: 'square', v: 0.035 });
        pickups.splice(qi, 1);
      }
    }

    // 跑动扬尘
    dustT -= dt;
    if (p.onGround && dustT <= 0) {
      dustT = 0.1;
      parts.push({ x: PX + 9 + Math.random() * 5, y: p.y - 2, vx: -speed * 0.22 - 15, vy: -25 - Math.random() * 35, life: 0.26, max: 0.36, color: 'rgba(255,255,255,.45)', size: 2, g: 120 });
    }

    spawnAhead();
    stepParticles(dt); stepTexts(dt); stepRings(dt);
  }

  function stepParticles(dt) {
    for (var k = parts.length - 1; k >= 0; k--) {
      var q = parts[k];
      q.life -= dt;
      if (q.life <= 0) { parts.splice(k, 1); continue; }
      q.vy += (q.g || 700) * dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
  }
  function stepTexts(dt) {
    for (var k = texts.length - 1; k >= 0; k--) {
      var q = texts[k];
      q.life -= dt; q.y += q.vy * dt; q.vy *= 0.94;
      if (q.life <= 0) texts.splice(k, 1);
    }
  }
  function stepRings(dt) {
    for (var k = rings.length - 1; k >= 0; k--) {
      var r = rings[k];
      r.life -= dt; r.r += 56 * dt;
      if (r.life <= 0) rings.splice(k, 1);
    }
  }

  // ================= 绘制 =================
  var cycle = 0;

  function drawSky(sk) {
    var g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, sk.a); g.addColorStop(1, sk.b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
    var nightF = Math.max(0, Math.sin(Math.PI * Math.max(0, (cycle - 0.48) / 0.5)));
    if (nightF > 0.02) {
      for (var i = 0; i < stars.length; i++) {
        var st = stars[i];
        ctx.globalAlpha = Math.min(1, nightF) * (0.5 + 0.5 * Math.sin(time * 2 + st.ph));
        px(st.x, st.y, st.s, st.s, '#ffffff');
      }
      ctx.globalAlpha = 1;
    }
    var isNight = cycle > 0.52 && cycle < 0.94;
    var sunX = 200 - Math.cos(cycle * Math.PI * 2) * 24;
    var sunY = 52 - Math.sin(cycle * Math.PI * 2) * 14;
    if (!isNight) {
      ctx.globalAlpha = 0.22; px(sunX - 8, sunY - 8, 34, 34, sk.sun); ctx.globalAlpha = 1;
      px(sunX, sunY, 18, 18, sk.sun);
      px(sunX - 5, sunY + 6, 28, 6, sk.sun);
      px(sunX + 6, sunY - 5, 6, 28, sk.sun);
    } else {
      px(sunX + 2, sunY, 15, 15, '#eef2ff');
      px(sunX + 5, sunY - 3, 9, 21, '#eef2ff');
      ctx.globalAlpha = 0.9; px(sunX + 9, sunY + 1, 8, 8, sk.a); ctx.globalAlpha = 1;
    }
    for (var c = 0; c < 5; c++) {
      var span = W + 120;
      var cx = ((c * 83 - camX * 0.12) % span + span) % span - 60;
      var cy = 44 + (c % 3) * 34;
      ctx.globalAlpha = isNight ? 0.35 : 0.95;
      px(cx, cy, 34, 9, '#ffffff');
      px(cx + 8, cy - 6, 20, 9, '#ffffff');
      px(cx + 8, cy + 9, 26, 3, 'rgba(180,210,240,.8)');
      ctx.globalAlpha = 1;
    }
  }

  function drawHills(sk) {
    for (var i = 0; i < 7; i++) {
      var span = W + 160;
      var hx = ((i * 61 - camX * 0.22) % span + span) % span - 80;
      var hh = 26 + ((i * 37) % 30);
      px(hx, GROUND - hh, 54, hh, sk.far);
      px(hx + 10, GROUND - hh - 12, 34, 14, sk.far);
      px(hx + 10, GROUND - hh - 12, 34, 3, sk.far2);
    }
    for (var k = 0; k < 6; k++) {
      var span2 = W + 120;
      var gx = ((k * 97 - camX * 0.45) % span2 + span2) % span2 - 60;
      var gh = 18 + ((k * 53) % 22);
      px(gx, GROUND - gh, 46, gh, sk.hill);
      px(gx, GROUND - gh, 46, 4, sk.hill2);
      px(gx + 12, GROUND - gh - 10, 22, 12, sk.hill);
      px(gx + 12, GROUND - gh - 10, 22, 3, sk.hill2);
    }
  }

  function drawGround() {
    var step = 20;
    var startX = Math.floor(camX / step) * step;
    for (var x = startX; x < camX + W + step; x += step) {
      var sx = x - camX;
      if (!groundAt(x + 10)) {
        var gd = ctx.createLinearGradient(0, GROUND, 0, H);
        gd.addColorStop(0, 'rgba(20,40,60,.55)');
        gd.addColorStop(1, 'rgba(4,8,16,.96)');
        ctx.fillStyle = gd; ctx.fillRect(sx, GROUND, step, H - GROUND);
        continue;
      }
      px(sx, GROUND, step, 7, '#63c744');
      px(sx, GROUND, step, 2, '#7ce05a');
      px(sx, GROUND + 7, step, H - GROUND - 7, '#8a5a2b');
      px(sx, GROUND + 7, step, 1, '#6f4620');
      px(sx + 9, GROUND + (Math.floor(x / 20) % 2 ? 20 : 30), 2, 8, '#6f4620');
      px(sx, GROUND + 40, step, 1, '#6f4620');
    }
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    ctx.fillRect(0, GROUND - 3, W, 3);
  }

  function drawSpeedLines() {
    if (speed <= 350) return;
    ctx.globalAlpha = Math.min(0.5, (speed - 350) / 320);
    for (var i = 0; i < 7; i++) {
      var ly = ((i * 53 + dist * 0.6) % (GROUND - 30)) + 20;
      var lx = ((W - ((dist * (1.1 + i * 0.07)) % (W + 90))) + W) % (W + 90) - 40;
      px(lx, ly, 14 + (i % 3) * 9, 1, 'rgba(255,255,255,.8)');
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacle(o) {
    var sx = o.x - camX;
    if (sx > W + 40 || sx + o.w < -40) return;
    var c = o.kind === 'stone' ? PAL.stone : PAL.wood;
    var d = o.kind === 'stone' ? PAL.stoneD : PAL.woodD;
    var t = o.kind === 'stone' ? PAL.stoneT : PAL.woodT;
    px(sx, o.y, o.w, o.h, c);
    px(sx, o.y, o.w, 4, t);
    px(sx + o.w - 4, o.y + 4, 4, o.h - 4, d);
    if (o.kind === 'stone') {
      px(sx + 4, o.y + 9, 5, 3, d);
      px(sx + o.w - 11, o.y + 15, 4, 4, d);
    } else {
      px(sx + 3, o.y + 8, o.w - 6, 2, d);
      px(sx + 3, o.y + 16, o.w - 6, 2, d);
    }
  }

  function drawSlime(m, r) {
    var sx = r.x - camX;
    if (m.dead && m.deadT > 0.3) return;
    var h = m.h * (m.dead ? Math.max(0.2, 1 - m.deadT * 2.6) : 1);
    var by = m.baseY - r.hop;
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.fillRect(sx + m.w / 2 - 6, m.baseY + 1, 12, 3);
    px(sx, by - h + 4, m.w, h - 4, PAL.slime);
    px(sx + 2, by - h, m.w - 4, 6, PAL.slime);
    px(sx, by - h + 4, m.w, 2, PAL.slimeT);
    px(sx + m.w - 3, by - h + 6, 3, h - 6, PAL.slimeD);
    if (!m.dead) {
      px(sx + 4, by - h + 1, 2, 4, '#1f3a1a');
      px(sx + m.w - 6, by - h + 1, 2, 4, '#1f3a1a');
      px(sx + m.w / 2 - 2, by - h + 6, 4, 2, '#2f6a26');
    }
  }
  function drawWalker(m, r) {
    var sx = r.x - camX;
    if (m.dead && m.deadT > 0.3) return;
    var bob = m.dead ? 0 : Math.sin(m.t * 8) * 1.5;
    var y = r.y + bob;
    ctx.fillStyle = 'rgba(0,0,0,.16)';
    ctx.fillRect(sx + 3, m.baseY + 1, m.w - 6, 3);
    var lp = Math.sin(m.t * 10) > 0 ? 1 : 0;
    px(sx + 2, y + m.h - 1, 4, 3 + lp, PAL.walkerD);
    px(sx + m.w - 6, y + m.h - 1, 4, 4 - lp, PAL.walkerD);
    px(sx, y, m.w, m.h, m.dead ? PAL.walkerD : PAL.walker);
    px(sx, y, m.w, 3, PAL.walkerT);
    px(sx + m.w - 3, y + 3, 3, m.h - 4, PAL.walkerD);
    if (!m.dead) {
      px(sx + 4, y + 4, 3, 4, '#3a1d0c');
      px(sx + m.w - 7, y + 4, 3, 4, '#3a1d0c');
      if (Math.sin(m.t * 6) > 0.6) px(sx + m.w / 2 - 2, y + 10, 5, 2, '#3a1d0c');
    }
  }
  function drawFlyer(m, r) {
    var sx = r.x - camX;
    if (m.dead && m.deadT > 0.3) return;
    var flap = Math.sin(m.t * 14 + m.phase);
    var wy = r.y + (m.dead ? m.deadT * 60 : 0);
    if (m.dead) ctx.globalAlpha = Math.max(0, 1 - m.deadT * 3);
    px(sx - 5, wy + 2 + flap * 2, 6, 4, PAL.flyerD);
    px(sx + m.w - 1, wy + 2 - flap * 2, 6, 4, PAL.flyerD);
    px(sx + 1, wy + 1, m.w - 2, m.h - 2, PAL.flyer);
    px(sx + 1, wy + 1, m.w - 2, 2, '#d7bcff');
    if (!m.dead) {
      px(sx + 4, wy + 4, 2, 2, PAL.flyerE);
      px(sx + m.w - 6, wy + 4, 2, 2, PAL.flyerE);
    }
    ctx.globalAlpha = 1;
  }
  function drawMobs() {
    for (var i = 0; i < mobs.length; i++) {
      var m = mobs[i], r = mobRect(m);
      if (m.kind === 'slime') drawSlime(m, r);
      else if (m.kind === 'walker') drawWalker(m, r);
      else drawFlyer(m, r);
    }
  }

  function drawBoss() {
    if (!boss) return;
    var B = boss, sx = B.x - camX;
    var bob = Math.sin(B.t * 4) * 2;
    var y = B.y + bob;
    if (B.dying > 0) ctx.globalAlpha = Math.max(0.2, B.dying / 0.7);
    // 影子
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(sx + 6, GROUND + 1, B.w - 12, 3);
    // 身体
    px(sx, y + 10, B.w, B.h - 10, B.hitFlash > 0 ? '#ffffff' : PAL.boss);
    px(sx + 4, y, B.w - 8, 16, B.hitFlash > 0 ? '#ffffff' : PAL.boss);
    px(sx, y + 10, B.w, 4, PAL.bossT);
    px(sx + B.w - 6, y + 14, 6, B.h - 14, PAL.bossD);
    // 角
    px(sx + 4, y - 8, 6, 10, PAL.horn);
    px(sx + B.w - 10, y - 8, 6, 10, PAL.horn);
    // 眼睛
    if (B.dying <= 0 && B.hitFlash <= 0) {
      var blinkB = Math.sin(time * 3) > 0.95;
      if (!blinkB) {
        px(sx + 8, y + 6, 7, 6, PAL.bossEye);
        px(sx + B.w - 15, y + 6, 7, 6, PAL.bossEye);
        px(sx + 10, y + 6, 2, 2, '#fff');
        px(sx + B.w - 13, y + 6, 2, 2, '#fff');
      } else {
        px(sx + 8, y + 8, 7, 2, PAL.bossEye);
        px(sx + B.w - 15, y + 8, 7, 2, PAL.bossEye);
      }
    }
    // 嘴
    px(sx + 10, y + 18, B.w - 20, 10, PAL.bossMouth);
    for (var t = 0; t < 4; t++) px(sx + 12 + t * 6, y + 18, 3, 4, '#ffffff');
    // 血条
    var hpw = 42;
    px(sx + B.w / 2 - hpw / 2 - 1, y - 18, hpw + 2, 6, 'rgba(0,0,0,.6)');
    px(sx + B.w / 2 - hpw / 2, y - 17, hpw * (B.hp / B.maxHp), 4, '#ff4d6d');
    txt('BOSS', sx + B.w / 2, y - 30, 8, '#ff6b6b', 'center', true);
    ctx.globalAlpha = 1;
  }

  function drawProjs() {
    for (var i = 0; i < projs.length; i++) {
      var pr = projs[i];
      var sx = pr.x - camX;
      if (sx > W + 20 || sx < -20) continue;
      var f = Math.sin(pr.t * 18) * 1.5;
      px(sx + 2, pr.y + f, 7, 7, PAL.fire);
      px(sx, pr.y + 2 + f, 11, 5, PAL.fire);
      px(sx + 2, pr.y + 2 + f, 4, 3, PAL.fireT);
      ctx.globalAlpha = 0.35;
      px(sx - 4, pr.y + 4 + f, 6, 4, PAL.fire);
      ctx.globalAlpha = 1;
    }
  }

  function drawPickups() {
    for (var i = 0; i < pickups.length; i++) {
      var pu = pickups[i];
      if (pu.got) continue;
      var sx = pu.x - camX;
      if (sx < -30 || sx > W + 30) continue;
      var bob = Math.sin(pu.t * 3.2) * 3;
      var glowC = pu.kind === 'star' ? PAL.star : (pu.kind === 'magnet' ? PAL.magnet : PAL.dbl);
      ctx.globalAlpha = 0.18 + 0.12 * Math.sin(time * 6);
      px(sx - 9, pu.y - 9 + bob, 18, 18, glowC);
      ctx.globalAlpha = 1;
      if (pu.kind === 'star') {
        px(sx - 5, pu.y - 5 + bob, 10, 10, PAL.star);
        px(sx - 7, pu.y - 1 + bob, 14, 3, PAL.star);
        px(sx - 1, pu.y - 8 + bob, 3, 14, PAL.star);
        px(sx - 2, pu.y - 2 + bob, 4, 4, '#fff6c4');
      } else if (pu.kind === 'magnet') {
        px(sx - 6, pu.y - 6 + bob, 4, 8, PAL.magnet);
        px(sx + 2, pu.y - 6 + bob, 4, 8, PAL.magnet);
        px(sx - 6, pu.y + 1 + bob, 12, 4, PAL.magnet);
        px(sx - 6, pu.y - 6 + bob, 4, 2, '#cfefff');
        px(sx + 2, pu.y - 6 + bob, 4, 2, '#cfefff');
      } else {
        px(sx - 7, pu.y - 6 + bob, 14, 12, PAL.dbl);
        txt('x2', sx, pu.y - 4 + bob, 9, '#3d0a2c', 'center', true);
      }
    }
  }

  function drawCoins() {
    for (var i = 0; i < coinList.length; i++) {
      var c = coinList[i];
      if (c.got) continue;
      var sx = c.x - camX;
      if (sx < -20 || sx > W + 20) continue;
      var bob = Math.sin(time * 4 + i) * 2;
      var sq = Math.abs(Math.cos(time * 3 + i * 0.7));
      var cw = Math.max(2, Math.round(10 * sq));
      px(sx - cw / 2, c.y - 6 + bob, cw, 12, PAL.coin);
      px(sx - cw / 2, c.y - 6 + bob, cw, 2, '#fff0a8');
      px(sx - cw / 2, c.y + 4 + bob, cw, 2, PAL.coinD);
      ctx.globalAlpha = 0.25;
      px(sx - 7, c.y - 1 + bob, 14, 2, PAL.coin);
      ctx.globalAlpha = 1;
    }
  }

  function drawTrail() {
    for (var i = 0; i < trail.length; i++) {
      var t = trail[i];
      ctx.globalAlpha = 0.16 * (t.life / t.max);
      ctx.save();
      ctx.translate(PX + PS / 2, t.y - PS / 2);
      ctx.rotate(t.rot);
      px(-PS / 2, -PS / 2, PS, PS, PAL.player);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    var sx = PX, sy = p.y;
    if (!p.onBlock) {
      var sh = 12 * Math.max(0.25, 1 - (GROUND - p.y) / 150);
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      ctx.fillRect(sx + 9 - sh / 2, GROUND + 1, sh, 3);
    }
    // 无敌光环
    if (inv > 0) {
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(time * 16);
      px(sx - 4, sy - PS - 4, PS + 8, PS + 8, PAL.star);
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(sx + PS / 2, sy - PS / 2);
    if (!p.onGround) ctx.rotate(p.rot);
    var sq = p.squash;
    ctx.scale(1 / sq, sq);
    var bx = -PS / 2, by = -PS / 2;
    px(bx, by, PS, PS, PAL.player);
    px(bx, by, PS, 3, PAL.playerL);
    px(bx + PS - 4, by + 3, 4, PS - 3, PAL.playerD);
    px(bx, by + PS - 3, PS, 3, PAL.playerD);
    var blink = (Math.sin(time * 2.2) > 0.97) ? 1 : 0;
    if (blink) {
      px(bx + 4, by + 7, 3, 2, PAL.eye);
      px(bx + 11, by + 7, 3, 2, PAL.eye);
    } else {
      px(bx + 4, by + 5, 3, 5, PAL.eye);
      px(bx + 11, by + 5, 3, 5, PAL.eye);
      px(bx + 5, by + 5, 1, 1, PAL.white);
      px(bx + 12, by + 5, 1, 1, PAL.white);
    }
    px(bx + 6, by + 13, 6, 2, PAL.mouth);
    ctx.restore();
  }

  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var q = parts[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, q.life / q.max));
      px(q.x, q.y, q.size, q.size, q.color);
    }
    ctx.globalAlpha = 1;
  }
  function drawRings() {
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      ctx.globalAlpha = Math.max(0, r.life / r.max) * 0.8;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function drawTexts() {
    for (var i = 0; i < texts.length; i++) {
      var t = texts[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life / t.max));
      txt(t.s, t.x, t.y, t.size, t.color, 'center', true);
    }
    ctx.globalAlpha = 1;
  }

  function drawPowerHud() {
    var y = 52;
    function bar(x, w, k, c) { px(x, y + 12, w, 2, 'rgba(0,0,0,.4)'); px(x, y + 12, w * k, 2, c); }
    if (inv > 0) {
      px(W - 66, y, 10, 10, PAL.star); bar(W - 66, 26, inv / 6, PAL.star);
    }
    if (magnet > 0) {
      px(W - 40, y, 3, 8, PAL.magnet); px(W - 35, y, 3, 8, PAL.magnet); px(W - 40, y + 5, 8, 3, PAL.magnet);
      bar(W - 40, 22, magnet / 8, PAL.magnet);
    }
    if (dbl > 0) {
      px(W - 14, y, 12, 10, PAL.dbl); txt('x2', W - 8, y + 1, 7, '#3d0a2c', 'center', true);
      bar(W - 22, 20, dbl / 10, PAL.dbl);
    }
  }

  function drawHud() {
    txt(String(score), 10, 8, 18, PAL.white, 'left', true);
    txt('BEST ' + best, 10, 30, 8, PAL.dim);
    px(W - 60, 11, 8, 10, PAL.coin);
    px(W - 60, 11, 8, 2, '#fff0a8');
    txt('×' + coinsGot, W - 47, 10, 10, PAL.white, 'left', true);
    if (combo > 1) {
      var k = Math.max(0, (comboUntil - time) / 2.6);
      txt('连击 ×' + combo, W - 10, 32, 9, '#ff9de0', 'right', true);
      px(W - 10 - 44 * k, 44, 44 * k, 2, '#ff9de0');
    }
    drawPowerHud();
  }

  function drawPanel(x, y, w, h) {
    ctx.fillStyle = 'rgba(10,10,20,.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(18,20,36,.97)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(x, y, w, 1);
    ctx.fillRect(x, y + h - 1, w, 1);
    ctx.fillRect(x, y, 1, h);
    ctx.fillRect(x + w - 1, y, 1, h);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(x + 4, y + 4, w - 8, 1);
  }
  function drawButton(b, label, primary) {
    ctx.fillStyle = primary ? '#ff8a3d' : 'rgba(255,255,255,.10)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = primary ? '#ffb37a' : 'rgba(255,255,255,.18)';
    ctx.fillRect(b.x, b.y, b.w, 2);
    txt(label, b.x + b.w / 2, b.y + (b.h - (primary ? 12 : 10)) / 2, primary ? 12 : 10,
      primary ? '#2a1206' : '#ffffff', 'center', true);
  }

  function drawMenu() {
    drawPanel(20, 62, 220, 292);
    txt('方块跳跃', W / 2, 78, 24, PAL.white, 'center', true);
    txt('BLOCK JUMP', W / 2, 108, 9, 'rgba(255,255,255,.55)', 'center');
    // 小图示
    px(W / 2 - 52, 130, 14, 14, PAL.player);
    px(W / 2 - 44, 133, 2, 4, PAL.eye);
    px(W / 2 - 36, 133, 2, 4, PAL.eye);
    px(W / 2 - 12, 128, 16, 14, PAL.slime);
    px(W / 2 - 7, 131, 2, 3, '#1f3a1a');
    px(W / 2, 131, 2, 3, '#1f3a1a');
    px(W / 2 + 24, 130, 18, 16, PAL.walker);
    px(W / 2 + 29, 133, 2, 3, '#3a1d0c');
    px(W / 2 + 35, 133, 2, 3, '#3a1d0c');
    txt('点击 / 空格 跳跃，空中再点二段跳', W / 2, 156, 9, PAL.dim, 'center');
    txt('踩小怪弹起 + 连击加分', W / 2, 172, 9, '#ffe36b', 'center');
    txt('★ 无敌   [磁铁] 吸金币   x2 双倍分', W / 2, 188, 8, 'rgba(255,255,255,.7)', 'center');
    txt('每关末有 BOSS，踩头 3 次击败', W / 2, 204, 8, '#ff9de0', 'center');
    txt('最高分  ' + best, W / 2, 226, 11, PAL.white, 'center', true);
    drawButton(BTN_START, '开 始 游 戏', true);
    drawButton(BTN_MENU_LB, '排 行 榜', false);
  }

  function drawOver() {
    var e = Math.min(1, (time - overAt) / 0.28);
    var py = 44 - (1 - e) * 16;
    drawPanel(16, py, 228, 332);
    txt('GAME OVER', W / 2, py + 12, 16, '#ff6b6b', 'center', true);
    var cause = {
      fall: '掉进了深坑', mob: '被小怪撞飞了', hit: '一头撞在方块上',
      boss: '被 BOSS 撞扁了', fire: '被 BOSS 火球打中'
    }[deadReason] || '被挡住了';
    txt(cause, W / 2, py + 32, 8, 'rgba(255,255,255,.6)', 'center');
    txt(String(Math.floor(score * e)), W / 2, py + 46, 28, PAL.coin, 'center', true);
    txt('分', W / 2 + 40, py + 62, 8, 'rgba(255,255,255,.6)', 'center');
    var st = [
      ['距离', Math.floor(dist / 10) + 'm'],
      ['金币', coinsGot],
      ['击杀', kills],
      ['连击', '×' + maxCombo]
    ];
    for (var i = 0; i < 4; i++) {
      txt(st[i][0], 42 + i * 47, py + 84, 8, 'rgba(255,255,255,.55)', 'center');
      txt(String(st[i][1]), 42 + i * 47, py + 96, 11, PAL.white, 'center', true);
    }
    txt('最高分 ' + best, W / 2, py + 118, 10, 'rgba(255,255,255,.8)', 'center', true);
    if (score > prevBest && score > 0) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 7);
      ctx.fillStyle = '#8fe36a';
      ctx.fillRect(W / 2 - 34, py + 134, 68, 15);
      txt('★ NEW RECORD ★', W / 2, py + 136, 8, '#10300c', 'center', true);
      ctx.globalAlpha = 1;
      if (Math.random() < 0.35) {
        parts.push({ x: Math.random() * W, y: py - 6, vx: (Math.random() - 0.5) * 60, vy: 40 + Math.random() * 60, life: 0.8, max: 0.8, color: Math.random() < 0.5 ? PAL.coin : '#ff9de0', size: 2, g: 120 });
      }
    } else {
      txt('差 ' + Math.max(0, best - score) + ' 分破纪录', W / 2, py + 136, 8, 'rgba(255,255,255,.5)', 'center');
    }
    txt(thisRank > 0 ? '本机排行 第 ' + thisRank + ' 名' : '未进本机前十', W / 2, py + 158, 8, 'rgba(255,255,255,.55)', 'center');
    drawButton({ x: BTN_RETRY.x, y: py + BTN_RETRY.y - 44, w: BTN_RETRY.w, h: BTN_RETRY.h }, '再 来 一 次', true);
    drawButton({ x: BTN_SHARE.x, y: py + BTN_SHARE.y - 44, w: BTN_SHARE.w, h: BTN_SHARE.h }, '分享', false);
    drawButton({ x: BTN_LB.x, y: py + BTN_LB.y - 44, w: BTN_LB.w, h: BTN_LB.h }, '排行榜', false);
  }

  function drawBoard() {
    drawPanel(20, 60, 220, 300);
    txt('排行榜', W / 2, 72, 14, PAL.white, 'center', true);
    var rows = boardTab === 0 ? LB : onlineRows;
    if (ONLINE) {
      drawButton({ x: BTN_TAB_LOCAL.x, y: BTN_TAB_LOCAL.y, w: BTN_TAB_LOCAL.w, h: BTN_TAB_LOCAL.h }, '本机', boardTab === 0);
      drawButton({ x: BTN_TAB_ONLINE.x, y: BTN_TAB_ONLINE.y, w: BTN_TAB_ONLINE.w, h: BTN_TAB_ONLINE.h }, '在线', boardTab === 1);
    }
    var top = ONLINE ? 122 : 100;
    if (boardTab === 1) {
      if (onlineState === 'loading') txt('加载中…', W / 2, top + 20, 10, PAL.dim, 'center');
      else if (onlineState === 'error' || onlineState === 'off') txt('在线排行连不上', W / 2, top + 20, 10, '#ff9d9d', 'center');
      else if (!rows.length) txt('还没有人上传成绩', W / 2, top + 20, 10, PAL.dim, 'center');
    }
    for (var i = 0; i < 8 && i < rows.length; i++) {
      var r = rows[i];
      var y = top + i * 22;
      var isNew = (boardTab === 0 && r.score === highlightScore && r.name === playerName);
      if (isNew) { ctx.fillStyle = 'rgba(255,227,107,.14)'; ctx.fillRect(30, y - 2, 200, 20); }
      txt(String(i + 1), 38, y, 10, i === 0 ? PAL.coin : PAL.white, 'center', true);
      txt(r.name || '匿名', 58, y, 9, PAL.dim);
      txt(String(r.score), 168, y, 11, i === 0 ? PAL.coin : PAL.white, 'right', true);
      txt((r.d || (r.created_at || '').slice(5, 10)) || '', 200, y + 1, 7, 'rgba(255,255,255,.4)', 'center');
    }
    if (!ONLINE && !rows.length) txt('本机还没有成绩', W / 2, top + 20, 10, PAL.dim, 'center');
    drawButton(BTN_BOARD_CLOSE, '关 闭', false);
  }

  function drawScanlines() {
    ctx.fillStyle = 'rgba(0,0,0,.05)';
    for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  }

  function draw() {
    cycle = (dist / 9000) % 1;
    var sk = skyAt(cycle);
    ctx.save();
    if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake));
    drawSky(sk);
    drawHills(sk);
    drawSpeedLines();
    drawGround();
    for (var i = 0; i < obs.length; i++) drawObstacle(obs[i]);
    drawCoins();
    drawPickups();
    drawMobs();
    drawBoss();
    drawProjs();
    drawTrail();
    drawPlayer();
    drawParts();
    drawRings();
    drawTexts();
    ctx.restore();

    drawHud();
    if (state === 'menu') drawMenu();
    if (state === 'over') {
      if (showBoard) drawBoard();
      else drawOver();
    }
    drawScanlines();

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.75).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (state === 'over' && deadReason) {
      ctx.globalAlpha = 0.25 * Math.max(0, 1 - (time - overAt) * 3);
      ctx.fillStyle = '#ff3b3b'; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (toastTimer > 0) {
      ctx.globalAlpha = Math.min(1, toastTimer * 2);
      ctx.fillStyle = 'rgba(0,0,0,.75)';
      ctx.fillRect(W / 2 - 52, H - 46, 104, 20);
      txt(toastMsg, W / 2, H - 41, 9, '#ffffff', 'center', true);
      ctx.globalAlpha = 1;
    }
  }

  // ================= 主循环 =================
  function frame(t) {
    var dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016;
    last = t;
    if (freeze > 0) {
      freeze = Math.max(0, freeze - dt);
      if (shake > 0) shake = Math.max(0, shake - dt * 30);
      if (flash > 0) flash = Math.max(0, flash - dt * 1.6);
      time += dt;
      draw();
      requestAnimationFrame(frame);
      return;
    }
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function () { ctx.imageSmoothingEnabled = false; });

  // 测试钩子
  window.__blockjump = {
    tap: tap, release: release, update: update, draw: draw, frame: frame,
    state: function () { return state; },
    world: function () {
      return { gaps: gaps, obs: obs, mobs: mobs, projs: projs, pickups: pickups, coins: coinList, camX: camX, speed: speed, trail: trail, parts: parts };
    },
    boss: function () { return boss; },
    player: function () { return p; },
    power: function () { return { inv: inv, magnet: magnet, dbl: dbl }; },
    stats: function () { return { score: score, best: best, coins: coinsGot, kills: kills, combo: combo, maxCombo: maxCombo, dist: dist, rank: thisRank, name: playerName }; },
    board: function () { return { local: LB, online: onlineRows, state: onlineState, tab: boardTab, show: showBoard, onlineOn: ONLINE }; },
    reason: function () { return deadReason; },
    config: CONFIG,
    reset: reset, start: start, die: die, loadOnline: loadOnline, debugBoss: spawnBoss
  };

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
