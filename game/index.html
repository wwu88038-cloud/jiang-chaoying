<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>方块跳跃 · Block Jump</title>
<style>
  :root{
    --glass: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    --glass-brd: rgba(255,255,255,.22);
    --ink: #f4f6ff;
    --dim: rgba(235,240,255,.74);
    --coral: #ff7a59;
    --gold: #ffd166;
    --mint: #43e8b8;
    --cyan: #50d5e8;
    --pink: #f472b6;
    --violet: #a78bfa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#070a14;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(120% 85% at 50% 45%, rgba(0,0,0,0) 55%, rgba(3,5,12,.45) 100%)}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 0%, rgba(12,16,32,.28), rgba(6,8,16,.62));
    z-index:5}
  .veil.hidden{display:none}
  .panel{width:min(420px,100%);max-height:calc(100% - 20px);overflow:auto;-webkit-overflow-scrolling:touch;
    border-radius:26px;padding:22px;
    background:var(--glass);border:1px solid var(--glass-brd);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 28px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.28);
    animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
  .kicker{font-size:11px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
  h1{margin:6px 0 4px;font-size:34px;letter-spacing:.02em;font-weight:800;
    background:linear-gradient(100deg,#fff,#ffd9c9 45%,#ffb38f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:14.5px;color:var(--dim);line-height:1.65}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
  .chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);font-size:12.5px;color:var(--dim)}
  .chip b{color:var(--ink);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
  .row{display:flex;gap:10px;margin-top:16px}
  button{font-family:inherit;border:none;cursor:pointer;color:var(--ink);font-weight:700;
    border-radius:16px;padding:15px 18px;font-size:15px;transition:transform .12s ease, filter .2s ease}
  button:active{transform:scale(.97)}
  .btn-primary{flex:1;color:#2a1109;font-size:16px;
    background:linear-gradient(135deg,#ffd0a8,#ff9f6b 45%,#ff7a59);
    box-shadow:0 14px 34px rgba(255,122,89,.35), inset 0 1px 0 rgba(255,255,255,.6)}
  .btn-ghost{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);font-weight:600}
  .btn-sm{padding:12px 14px;font-size:13px;border-radius:14px}
  .hero-row{display:flex;align-items:center;gap:14px;margin-bottom:4px}
  .hero-art{width:108px;height:78px;flex:none;animation:bob 2.8s ease-in-out infinite}
  .hero-art svg{width:100%;height:100%;display:block;
    filter:drop-shadow(0 12px 22px rgba(77,107,254,.4))}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .hero-copy h1{margin:2px 0 4px;font-size:27px}
  .hero-copy .kicker{font-size:10px}
  .hero-copy .sub{font-size:12.5px;line-height:1.55}
  .namerow{display:flex;align-items:center;gap:10px;margin-top:16px;padding:8px 8px 8px 14px;
    border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
  .namerow .nlbl{font-size:12.5px;color:var(--dim);flex:none}
  .namerow input{flex:1;min-width:0;border:none;outline:none;background:transparent;
    font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);padding:6px 0}
  .namerow input::placeholder{color:rgba(235,240,255,.35);font-weight:600}
  .bestline{display:flex;align-items:baseline;gap:8px;margin-top:14px}
  .bestline .num{font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .bestline .lbl{font-size:13px;color:var(--dim)}
  /* 结算 */
  .score-wrap{text-align:center;margin:10px 0 6px}
  .score-big{font-size:58px;font-weight:800;line-height:1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#ffd166 70%,#ff9f43);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 8px 24px rgba(255,209,102,.25))}
  .cause{text-align:center;font-size:14px;color:var(--dim);margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 6px}
  .cell{padding:11px 6px;border-radius:16px;text-align:center;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
  .cell .k{font-size:12px;color:var(--dim)}
  .cell .v{font-size:17px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 12px;border-radius:999px;
    font-size:12px;font-weight:700;color:#12301f;background:linear-gradient(135deg,#a7f3c9,#43e8b8);
    box-shadow:0 8px 24px rgba(67,232,184,.28)}
  .rank{text-align:center;font-size:13px;color:var(--dim);margin-top:10px}
  /* HUD */
  #hud{position:absolute;inset:0;z-index:4;pointer-events:none;
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom))}
  #hud.hidden{display:none}
  .pill{position:absolute;display:flex;align-items:center;gap:8px;
    padding:9px 13px;border-radius:16px;background:var(--glass);border:1px solid var(--glass-brd);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 10px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.24)}
  #scorePill{left:14px;top:calc(12px + env(safe-area-inset-top));padding:12px 18px;border-radius:18px}
  #scoreVal{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;min-width:20px;text-align:left}

  #coinPill{right:14px;top:calc(12px + env(safe-area-inset-top))}
  .coin{width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff3c4,#ffd166 55%,#e0a91f);
    box-shadow:0 0 12px rgba(255,209,102,.5)}
  #coinVal{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
  #powerRow{position:absolute;right:14px;top:calc(70px + env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  .pw{display:none;align-items:center;gap:7px;padding:7px 11px;border-radius:13px;
    background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);font-size:11px;font-weight:700}
  .pw.on{display:flex}
  .pw i{width:14px;height:14px;border-radius:5px;display:block}
  .pw .bar{width:40px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
  .pw .bar em{display:block;height:100%;width:100%;background:currentColor;border-radius:2px}
  #comboChip{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);
    padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800;color:#3d0a2c;
    background:linear-gradient(135deg,#ffd0e8,#f472b6);box-shadow:0 8px 24px rgba(244,114,182,.35);
    display:none;white-space:nowrap}
  #comboChip.on{display:block;animation:pop .2s ease}
  #bossWrap{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);
    width:min(240px,60%);display:none}
  #bossWrap.on{display:block}
  .boss-label{text-align:center;font-size:10px;letter-spacing:.28em;color:#ff9db0;margin-bottom:5px;font-weight:800}
  .boss-track{height:8px;border-radius:99px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.16);overflow:hidden}
  .boss-fill{height:100%;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#ff4d6d,#ff9db0);transition:width .18s ease;
    box-shadow:0 0 14px rgba(255,77,109,.6)}
  /* 排行榜 */
  .tabs{display:flex;gap:8px;margin:14px 0 10px;background:rgba(0,0,0,.22);padding:5px;border-radius:14px}
  .tab{flex:1;padding:10px;border-radius:11px;font-size:14px;font-weight:700;color:var(--dim);
    background:transparent;border:none}
  .tab.on{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
  #boardList{max-height:38vh;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:7px}
  .lbrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:14px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);font-size:14px}
  .lbrow.me{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.4)}
  .lbrow .no{width:20px;text-align:center;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
  .lbrow.me .no{color:var(--gold)}
  .lbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(240,245,255,.88)}
  .lbrow .sc{font-weight:800;font-variant-numeric:tabular-nums}
  .lbrow .dt{font-size:11px;color:rgba(255,255,255,.45)}
  .empty{text-align:center;padding:26px 0;font-size:13px;color:var(--dim)}
  /* 声音按钮 / toast */
  #soundBtn{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;
    width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;
    font-size:18px;background:var(--glass);border:1px solid var(--glass-brd);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 26px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.24)}
  #toast{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(8px);padding:11px 20px;border-radius:999px;
    font-size:14px;font-weight:700;color:#fff;white-space:nowrap;
    background:rgba(14,18,32,.82);border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 12px 34px rgba(0,0,0,.45);opacity:0;transition:opacity .18s ease,transform .18s ease;z-index:7}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="pill" id="scorePill"><span id="scoreVal">0</span></div>
    <div class="pill" id="coinPill"><span class="coin"></span><span id="coinVal">0</span></div>
    <div id="powerRow">
      <div class="pw" id="pwStar" style="color:var(--gold)"><i style="background:var(--gold)"></i><span>无敌</span><span class="bar"><em></em></span></div>
      <div class="pw" id="pwMag" style="color:var(--cyan)"><i style="background:var(--cyan)"></i><span>磁铁</span><span class="bar"><em></em></span></div>
      <div class="pw" id="pwDbl" style="color:var(--pink)"><i style="background:var(--pink)"></i><span>双倍</span><span class="bar"><em></em></span></div>
      <div class="pw" id="pwShield" style="color:#7ee7ff"><i style="background:#7ee7ff"></i><span>护盾</span><span class="bar"><em></em></span></div>
      <div class="pw" id="pwSlow" style="color:#c084fc"><i style="background:#c084fc"></i><span>缓速</span><span class="bar"><em></em></span></div>
    </div>
    <div id="comboChip"></div>
    <div id="bossWrap">
      <div class="boss-label">BOSS</div>
      <div class="boss-track"><div class="boss-fill" id="bossFill"></div></div>
    </div>
  </div>

  <button id="soundBtn" aria-label="声音">🔊</button>
  <div id="toast"></div>

  <div id="menu" class="veil">
    <div class="panel">
      <div class="hero-row">
        <div class="hero-art" id="heroArt"></div>
        <div class="hero-copy">
          <div class="kicker">BLOCK JUMP · v4.4</div>
          <h1>方块跳跃</h1>
          <p class="sub">你是粉色小肥鱼：点一下跳跃，空中再点二段跳（镜头已拉远）。<br>踩住小怪弹起来；BOSS 关保持距离，躲子弹、捡「反击」轰它。</p>
        </div>
      </div>
      <div class="chips">
        <span class="chip"><span class="dot" style="color:#ff6b8b"></span><b>3 种小怪</b> 可踩</span>
        <span class="chip"><span class="dot" style="color:#ffd166"></span><b>5 种道具</b> 无敌/磁铁/双倍/护盾/缓速</span>
        <span class="chip"><span class="dot" style="color:#a78bfa"></span><b>BOSS 战</b> 躲子弹捡反击</span>
      </div>
      <div class="namerow">
        <span class="nlbl">昵称</span>
        <input id="nameInput" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="给自己起个名字">
      </div>
      <div class="bestline"><span class="lbl">最高分</span><span class="num" id="menuBest">0</span></div>
      <div class="row">
        <button class="btn-primary" id="btnStart">开始游戏</button>
      </div>
      <div class="row">
        <button class="btn-ghost btn-sm" id="btnMenuBoard" style="flex:1">排行榜</button>
        <button class="btn-ghost btn-sm" id="btnMenuSound" style="flex:1">音效</button>
      </div>
    </div>
  </div>

  <div id="over" class="veil hidden">
    <div class="panel">
      <div class="kicker" style="color:#ff9db0">Game Over</div>
      <div class="score-wrap"><div class="score-big" id="overScore">0</div></div>
      <div class="cause" id="overCause"></div>
      <div class="grid">
        <div class="cell"><div class="k">距离</div><div class="v" id="stDist">0m</div></div>
        <div class="cell"><div class="k">金币</div><div class="v" id="stCoin">0</div></div>
        <div class="cell"><div class="k">击杀</div><div class="v" id="stKill">0</div></div>
        <div class="cell"><div class="k">连击</div><div class="v" id="stCombo">×0</div></div>
      </div>
      <div style="text-align:center"><span class="badge hidden" id="newRecord">★ 新纪录</span></div>
      <div class="rank" id="overRank"></div>
      <div class="row"><button class="btn-primary" id="btnRetry">再来一次</button></div>
      <div class="row">
        <button class="btn-ghost btn-sm" id="btnShare" style="flex:1">分享</button>
        <button class="btn-ghost btn-sm" id="btnBoard" style="flex:1">排行榜</button>
      </div>
    </div>
  </div>

  <div id="board" class="veil hidden">
    <div class="panel">
      <div class="kicker">Leaderboard</div>
      <h1 style="font-size:26px">排行榜</h1>
      <div class="tabs">
        <button class="tab on" id="tabLocal" data-tab="0">本机</button>
        <button class="tab" id="tabOnline" data-tab="1">在线</button>
      </div>
      <div id="boardList"></div>
      <div class="row"><button class="btn-ghost" id="btnBoardClose" style="flex:1">关闭</button></div>
    </div>
  </div>
</div>

      return { x: m.x, y: m.baseY - hop - m.h, w: m.w, h: m.h };
    }
    if (m.kind === 'flyer') {
      var fy = m.baseY + Math.sin(m.t * 2.6 + m.phase) * 14;
      return { x: m.x, y: fy, w: m.w, h: m.h };
    }
    return { x: m.x, y: m.baseY - m.h, w: m.w, h: m.h };
  }
  function bossRect(b) { return { x: b.x, y: b.y, w: b.w, h: b.h }; }

  // ================= 输入 =================
  cvs.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (state !== 'play') return;
    if (p.onGround) {
      p.vy = JUMP; p.jumps = 1; p.onGround = false; p.squash = 0.74;
      beep(720, 0.06, 'sine', 0.05);
      ringFx(PX + PS / 2, p.y, 'rgba(255,255,255,.5)');
      burst(PX + PS / 2, p.y, 'rgba(255,255,255,.6)', 5, 0.6);
    } else if (p.jumps < 2) {
      p.vy = JUMP2; p.jumps = 2; p.spin = 0.14;
      beep(980, 0.06, 'sine', 0.045);
      ringFx(PX + PS / 2, p.y - PS / 2, 'rgba(255,209,102,.8)');
      sparkle(PX + PS / 2, p.y - PS / 2, C.star);
    }
  });
  cvs.addEventListener('pointerup', function () { if (state === 'play' && p.vy < CUT) p.vy = CUT; });
  cvs.addEventListener('pointercancel', function () { if (state === 'play' && p.vy < CUT) p.vy = CUT; });
  window.addEventListener('keydown', function (ev) {
    if (ev.code === 'Space' || ev.code === 'ArrowUp' || ev.code === 'KeyW') {
      ev.preventDefault();
      if (state === 'play' && !ev.repeat) {
        if (p.onGround) { p.vy = JUMP; p.jumps = 1; p.onGround = false; }
        else if (p.jumps < 2) { p.vy = JUMP2; p.jumps = 2; }
      }
    }
    if (ev.code === 'KeyR' && state === 'over') start();
  });
  document.addEventListener('visibilitychange', function () { last = 0; });

  // ================= 逻辑 =================
  function addCombo(n) { combo += n; comboUntil = time + 2.6; if (combo > maxCombo) maxCombo = combo; }
  function addBonus(n) { bonusScore += n * (dbl > 0 ? 2 : 1); }

  function update(dt) {
    time += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 52);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.9);
    if (toastT > 0) {
      toastT = Math.max(0, toastT - dt);
      if (toastT === 0 && el.toast) el.toast.classList.remove('on');
    }
    if (sndQ.length && time >= sndQ[0].at) { var sq = sndQ.shift(); beep(sq.f, sq.d, sq.t, sq.v); }
    musicTick();
    worldT += dt; auroraT += dt * 0.15;

    if (state !== 'play') {
      if (state === 'menu') camX += 40 * dt;
      stepParticles(dt); stepTexts(dt); stepRings(dt);
      return;
    }

    var wm = slow > 0 ? 0.6 : 1;
    if (arena) speed = 0;
    else {
      speed = Math.min(760, 300 + dist * 0.055);
      camX += speed * wm * dt; dist += speed * wm * dt;
      baseScore += speed * wm * dt / 15 * (dbl > 0 ? 2 : 1);
      score = Math.floor(baseScore) + bonusScore;
    }
    if (score > best) best = score;
    if (combo > 0 && time > comboUntil) combo = 0;
    if (inv > 0) inv = Math.max(0, inv - dt);
    if (slow > 0) slow = Math.max(0, slow - dt);
    if (magnet > 0) magnet = Math.max(0, magnet - dt);
    if (dbl > 0) dbl = Math.max(0, dbl - dt);
    if (!boss && score >= nextBossAt) spawnBoss();

    // 竖直
    var oldY = p.y;
    p.vy += GRAV * dt; p.y += p.vy * dt;
    p.rot += (p.onGround ? 0 : 5.4) * dt + p.spin;
    if (p.spin > 0) p.spin = Math.max(0, p.spin - dt * 6);
    var feet = camX + PX + PS / 2, lx = camX + PX + 4, rx = camX + PX + PS - 4;
    var support = Infinity;
    if (groundAt(feet) && groundAt(lx) && groundAt(rx)) support = GROUND;
    for (var b = 0; b < obs.length; b++) {
      var ob = obs[b];
      if (ob.x + ob.w > lx && ob.x < rx && p.vy >= 0 && oldY <= ob.y + 1 && ob.y < support) support = ob.y;
    }
    if (p.vy >= 0 && support < Infinity && p.y >= support) {
      if (!p.onGround && p.vy > 300) {
        p.squash = 0.7;
        burst(PX + PS / 2, support, 'rgba(255,255,255,.55)', 6, 0.7);
        ringFx(PX + PS / 2, support, 'rgba(255,255,255,.4)');
        beep(320, 0.05, 'sine', 0.035);
      }
      p.y = support; p.vy = 0; p.jumps = 0; p.onGround = true; p.rot = 0;
    } else p.onGround = false;
    if (p.y > H + 120) die('fall');
    p.squash += (1 - p.squash) * Math.min(1, dt * 12);

    // 残影
    if (speed > 520 && Math.random() < 0.55) trail.push({ y: p.y, rot: p.rot, life: 0.2, max: 0.2 });
    for (var ti = trail.length - 1; ti >= 0; ti--) { trail[ti].life -= dt; if (trail[ti].life <= 0) trail.splice(ti, 1); }

    // 障碍
    for (var i = obs.length - 1; i >= 0; i--) {
      var o = obs[i];
      if (o.x + o.w > lx && o.x < rx && p.y > o.y + 6 && p.y - PS < o.y + o.h - 1) {
        if (inv > 0) {
          burst(o.x - camX + o.w / 2, o.y + o.h / 2, o.kind === 'stone' ? C.stone : C.crate, 12, 1.2);
          obs.splice(i, 1); addBonus(15); floatText('+15', o.x - camX, o.y, '#fff', 15);
          beep(420, 0.06, 'square', 0.03);
        } else if (tryAbsorb()) {
          burst(o.x - camX + o.w / 2, o.y + o.h / 2, C.shield, 16, 1.5);
          obs.splice(i, 1);
        } else { die('hit'); return; }
      }
    }

    // 小怪
    for (var mi = 0; mi < mobs.length; mi++) {
      var m = mobs[mi];
      m.t += dt;
      if (m.dead) { m.deadT += dt; continue; }
      if (m.kind === 'walker') m.x += m.vx * speed * wm * dt * 0.5;
      var mr = mobRect(m);
      var sxr = mr.x - camX;
      if (sxr > W + 60 || sxr + mr.w < -60) continue;
      var hitX = mr.x + mr.w > lx + 3 && mr.x < rx - 3;
      var hitY = p.y > mr.y + 3 && p.y - PS < mr.y + mr.h - 3;
      if (hitX && hitY) {
        var cx = sxr + m.w / 2, cy = mr.y + mr.h / 2;
        if (inv > 0) {
          m.dead = true; m.deadT = 0; kills++; addCombo(1); addBonus(30);
          burst(cx, cy, C.pink || '#f472b6', 14, 1.5);
          floatText('+30', cx, mr.y - 6, '#ffd166', 16);
          beep(760, 0.05, 'sine', 0.035);
        } else if (p.vy > 70 && p.y - PS < mr.y + mr.h * 0.72) {
          m.dead = true; m.deadT = 0; kills++; addCombo(1);
          var gain = 30 + Math.min(60, (combo - 1) * 10);
          addBonus(gain);
          p.vy = STOMP_BOUNCE; p.jumps = 1; p.onGround = false; p.squash = 0.68;
          var col = m.kind === 'slime' ? C.slime : (m.kind === 'walker' ? C.walker : C.flyer);
          burst(cx, cy, col, 14, 1.6);
          burst(cx, cy, '#ffffff', 6, 1.1);
          ringFx(cx, cy, 'rgba(255,255,255,.85)');
          floatText('+' + gain, cx, mr.y - 10, '#ffd166', 18);
          if (combo > 1) floatText('连击 ×' + combo, PX + PS / 2, p.y - 90, '#f472b6', 16);
          beep(840, 0.05, 'sine', 0.04);
          sndQ.push({ at: time + 0.05, f: 1180, d: 0.06, t: 'sine', v: 0.03 });
          vibrate(18);
        } else if (tryAbsorb()) {
          m.dead = true; m.deadT = 0; kills++; addCombo(1); addBonus(20);
          p.vy = -760; p.jumps = 1; p.onGround = false;
          burst(cx, cy, C.shield, 18, 1.7);
          ringFx(cx, cy, 'rgba(126,231,255,.9)');
          floatText('格挡!', cx, mr.y - 20, '#7ee7ff', 20);
        } else { die('mob'); return; }
      }
    }

    // BOSS：保持距离，靠反击弹打
    if (boss) {
      var B = boss;
      B.t += dt;
      if (B.hitFlash > 0) B.hitFlash = Math.max(0, B.hitFlash - dt);
      if (B.dying > 0) {
        B.dying -= dt;
        if (B.dying <= 0) {
          boss = null; arena = false;
          nextBossAt = score + BOSS_GAP;
          nextX = camX + W + 240;
          projs = []; pickups = []; rockets = [];
          addBonus(500);
          floatText('BOSS DOWN +500', W / 2, 220, '#ffd166', 26);
          flash = 0.5; shake = 14;
          for (var cb = 0; cb < 5; cb++) burst(B.x - camX + B.w / 2, B.y + B.h / 2, C.coin, 22, 2);
          ringFx(B.x - camX + B.w / 2, B.y + B.h / 2, 'rgba(255,255,255,.9)');
          beep(660, 0.1, 'sine', 0.06);
          sndQ.push({ at: time + 0.1, f: 990, d: 0.12, t: 'sine', v: 0.05 });
          sndQ.push({ at: time + 0.22, f: 1320, d: 0.16, t: 'sine', v: 0.05 });
          syncHud(true);
        }
      } else {
        // 悬浮呼吸
        B.x = B.baseX + Math.sin(B.t * 1.15) * 16;
        B.y = B.baseY + Math.sin(B.t * 1.7) * 30;
        // 攻击
        B.attackT -= dt;
        if (B.attackT <= 0) {
          B.attackT = Math.max(1.7, 2.4 + Math.random() * 0.6 - (3 - B.hp) * 0.1);
          B.hitFlash = 0.12;
          firePattern(B);
          beep(240, 0.12, 'sawtooth', 0.045);
        }
        // 刷反击弹
        B.counterT -= dt;
        if (B.counterT <= 0) {
          B.counterT = 1.7;
          var hasCounter = false;
          for (var pc = 0; pc < pickups.length; pc++) if (pickups[pc].kind === 'counter') hasCounter = true;
          if (!hasCounter) {
            pickups.push({ x: camX + W + 40, y: GROUND - 34, kind: 'counter', t: 0, got: false, vx: -215, ground: true });
          }
        }
      }
    }

    // 火球
    for (var pi = projs.length - 1; pi >= 0; pi--) {
      var pr = projs[pi];
      pr.t += dt; pr.x += pr.vx * wm * dt;
      if (pr.x + pr.w < camX - 40) { projs.splice(pi, 1); continue; }
      var prx = pr.x - camX;
      if (pr.x + pr.w > lx + 2 && pr.x < rx - 1 && p.y > pr.y + 4 && p.y - PS < pr.y + pr.h - 1) {
        if (inv > 0) {
          burst(prx + pr.w / 2, pr.y + pr.h / 2, '#ffb28f', 12, 1.2);
          projs.splice(pi, 1); addBonus(20); floatText('+20', prx, pr.y - 8, '#ffb28f', 14);
          beep(560, 0.05, 'square', 0.03);
        } else if (tryAbsorb()) {
          burst(prx + pr.w / 2, pr.y + pr.h / 2, C.shield, 14, 1.4);
          projs.splice(pi, 1);
        } else { die('fire'); return; }
      }
    }

    // 反击弹飞行
    for (var ri = rockets.length - 1; ri >= 0; ri--) {
      var rk = rockets[ri];
      rk.t += dt;
      var tx = boss ? (boss.x - camX + boss.w / 2) : W + 60;
      var ty = boss ? (boss.y + boss.h / 2) : -60;
      var dx = tx - rk.x, dy = ty - rk.y;
      var dl = Math.sqrt(dx * dx + dy * dy) || 1;
      var rsp = 900;
      rk.x += (dx / dl) * rsp * dt;
      rk.y += (dy / dl) * rsp * dt;
      if (Math.random() < 0.75) parts.push({ x: rk.x - 8, y: rk.y + 2, vx: -60 - Math.random() * 60, vy: 20 + Math.random() * 40, life: 0.24, max: 0.24, color: '#ffb28f', r: 3, g: 0 });
      var hitBoss = boss && boss.dying <= 0 && Math.sqrt(Math.pow(tx - rk.x, 2) + Math.pow(ty - rk.y, 2)) < 46;
      if (hitBoss) {
        rockets.splice(ri, 1);
        boss.hp--; boss.hitFlash = 0.35; shake = 13;
        burst(tx, ty, '#ffd166', 20, 1.8);
        burst(tx, ty, '#ff7a59', 14, 1.5);
        ringFx(tx, ty, 'rgba(255,255,255,.9)');
        floatText('-1 HP', tx, ty - 50, '#ffd166', 22);
        beep(520, 0.09, 'square', 0.05);
        sndQ.push({ at: time + 0.06, f: 880, d: 0.1, t: 'sine', v: 0.04 });
        vibrate(30);
        syncHud(true);
        if (boss.hp <= 0) { boss.dying = 0.85; projs = []; pickups = []; }
      } else if (rk.x > W + 100 || rk.y < -140 || rk.x < -60) {
        rockets.splice(ri, 1);
      }
    }

    // 金币
    var pcx = PX + PS / 2, pcy = p.y - PS / 2;
    for (var j = 0; j < coinList.length; j++) {
      var c = coinList[j];
      if (c.got) continue;
      if (magnet > 0) {
        var dxw = (camX + pcx) - c.x, dyw = pcy - c.y;
        var dd = Math.sqrt(dxw * dxw + dyw * dyw);
        if (dd < 200 && dd > 1) { c.x += (dxw / dd) * 640 * dt; c.y += (dyw / dd) * 640 * dt; }
      }
      var csx = c.x - camX;
      if (Math.abs(csx - pcx) < 24 && Math.abs(c.y - pcy) < 25) {
        c.got = true; coinsGot++; addBonus(10); sparkle(csx, c.y, C.coin);
        floatText('+10', csx, c.y - 12, '#ffd166', 14);
        beep(1180, 0.05, 'sine', 0.03);
      }
    }

    // 反击弹（Boss 关专用，捡到自动反击）
    for (var ci = pickups.length - 1; ci >= 0; ci--) {
      var cu = pickups[ci];
      if (cu.kind !== 'counter') continue;
      cu.t += dt;
      if (cu.vx) cu.x += cu.vx * wm * dt;
      var cux = cu.x - camX;
      if (cux < -60) { pickups.splice(ci, 1); continue; }
      if (Math.abs(cux - pcx) < 40 && Math.abs(cu.y - pcy) < 46) {
        burst(cux, cu.y, '#ff9f6b', 16, 1.5);
        ringFx(cux, cu.y, 'rgba(255,255,255,.85)');
        pickups.splice(ci, 1);
        shootRocket();
        vibrate(20);
      }
    }

    // 道具
    for (var qi = pickups.length - 1; qi >= 0; qi--) {
      var pu = pickups[qi];
      pu.t += dt;
      var pux = pu.x - camX;
      if (pux < -60) { pickups.splice(qi, 1); continue; }
      if (Math.abs(pux - pcx) < 30 && Math.abs(pu.y - pcy) < 32) {
        if (pu.kind === 'star') { inv = 6; toast('无敌 6 秒'); }
        else if (pu.kind === 'magnet') { magnet = 8; toast('磁铁 8 秒'); }
        else if (pu.kind === 'shield') { shield = 1; toast('护盾已装备'); }
        else if (pu.kind === 'slow') { slow = 6; toast('缓速 6 秒'); }
        else { dbl = 10; toast('双倍分数 10 秒'); }
        var pcol = pu.kind === 'star' ? C.star : (pu.kind === 'magnet' ? C.magnet :
          (pu.kind === 'shield' ? C.shield : (pu.kind === 'slow' ? C.slow : C.dbl)));
        burst(pux, pu.y, pcol, 16, 1.4);
        ringFx(pux, pu.y, 'rgba(255,255,255,.8)');
        beep(880, 0.06, 'sine', 0.045);
        sndQ.push({ at: time + 0.06, f: 1320, d: 0.09, t: 'sine', v: 0.035 });
        pickups.splice(qi, 1);
      }
    }

    // 尘土
    dustT -= dt;
    if (p.onGround && dustT <= 0) {
      dustT = 0.1;
      parts.push({ x: PX + PS / 2 + Math.random() * 8, y: p.y - 3, vx: -speed * 0.2 - 20, vy: -40 - Math.random() * 50, life: 0.28, max: 0.38, color: 'rgba(185,230,255,.4)', r: 2 + Math.random() * 2, g: 120 });
    }

    spawnAhead();
    stepParticles(dt); stepTexts(dt); stepRings(dt);
    syncHud(false);
  }

  function stepParticles(dt) {
    for (var k = parts.length - 1; k >= 0; k--) {
      var q = parts[k];
      q.life -= dt;
      if (q.life <= 0) { parts.splice(k, 1); continue; }
      q.vy += (q.g || 900) * dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
  }
  function stepTexts(dt) {
    for (var k = texts.length - 1; k >= 0; k--) {
      var q = texts[k];
      q.life -= dt; q.y += q.vy * dt; q.vy *= 0.94;
      if (q.life <= 0) texts.splice(k, 1);
    }
  }
  function stepRings(dt) {
    for (var k = rings.length - 1; k >= 0; k--) {
      var r = rings[k];
      r.life -= dt; r.r += 90 * dt;
      if (r.life <= 0) rings.splice(k, 1);
    }
  }

  // ================= HUD 同步 =================
  var hudCache = {};
  function syncHud(force) {
    if (!el.scoreVal) return;
    if (force || hudCache.score !== score) { el.scoreVal.textContent = Math.floor(score); hudCache.score = score; }
    if (force || hudCache.coins !== coinsGot) { el.coinVal.textContent = coinsGot; hudCache.coins = coinsGot; }
    if (force || hudCache.combo !== combo) {
      if (combo > 1) { el.combo.textContent = '连击 ×' + combo; el.combo.classList.add('on'); }
      else el.combo.classList.remove('on');
      hudCache.combo = combo;
    }
    function pw(node, val, max) {
      if (!node) return;
      if (val > 0) {
        node.classList.add('on');
        var bar = node.querySelector ? node.querySelector('em') : null;
        if (bar) bar.style.width = Math.max(0, Math.min(100, (val / max) * 100)) + '%';
      } else node.classList.remove('on');
    }
    pw(el.pwStar, inv, 6); pw(el.pwMag, magnet, 8); pw(el.pwDbl, dbl, 10);
    pw(el.pwShield, shield, 1); pw(el.pwSlow, slow, 6);
    if (el.bossWrap) {
      if (boss && !boss.dying) {
        el.bossWrap.classList.add('on');
        if (el.bossFill) el.bossFill.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
      } else el.bossWrap.classList.remove('on');
    }
  }

  // ================= 绘制 =================
  var starsLayer = new Array(70);
  for (var s2 = 0; s2 < 70; s2++) starsLayer[s2] = Math.random() * 1000;

  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, C.skyTop);
    g.addColorStop(0.55, C.skyMid);
    g.addColorStop(1, C.skyLow);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GROUND);

    // 地平线暖光
    var hg = ctx.createLinearGradient(0, GROUND - 160, 0, GROUND);
    hg.addColorStop(0, 'rgba(255,158,122,0)');
    hg.addColorStop(1, 'rgba(255,158,122,.28)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, GROUND - 160, W, 160);

    // 星星
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(worldT * 1.6 + st.ph));
      ctx.globalAlpha = tw * 0.8;
      ctx.fillStyle = '#ffffff';
      circle(st.x, st.y, st.r); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 发光星体
    var cx = W * 0.78 - Math.cos((camX * 0.0004)) * 22, cy = 132;
    var glow = ctx.createRadialGradient(cx, cy, 6, cx, cy, 90);
    glow.addColorStop(0, 'rgba(255,224,180,.55)');
    glow.addColorStop(1, 'rgba(255,224,180,0)');
    ctx.fillStyle = glow;
    circle(cx, cy, 90); ctx.fill();
    var sunG = ctx.createLinearGradient(cx, cy - 26, cx, cy + 26);
    sunG.addColorStop(0, '#fff3d6');
    sunG.addColorStop(1, '#ffb38f');
    ctx.fillStyle = sunG;
    circle(cx, cy, 24); ctx.fill();

    // 极光/薄雾
    ctx.globalAlpha = 0.16;
    for (var a = 0; a < 3; a++) {
      var ay = 150 + a * 52 + Math.sin(auroraT + a) * 10;
      var ag = ctx.createLinearGradient(0, ay, W, ay + 60);
      ag.addColorStop(0, 'rgba(126,231,255,0)');
      ag.addColorStop(0.5, a % 2 ? 'rgba(255,158,122,.9)' : 'rgba(126,231,255,.9)');
      ag.addColorStop(1, 'rgba(167,139,250,0)');
      ctx.fillStyle = ag;
      ctx.fillRect(0, ay, W, 46);
    }
    ctx.globalAlpha = 1;

    // 远山三层
    drawHillLayer(C.hill1, 0.12, 150, 0.9);
    drawHillLayer(C.hill2, 0.24, 110, 1.3);
    drawHillLayer(C.hill3, 0.42, 76, 1.8);
  }
  function drawHillLayer(color, par, base, amp) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (var x = 0; x <= W; x += 20) {
      var wx = camX * par + x;
      var y = GROUND - base - Math.sin(wx * 0.006) * 34 * amp - Math.sin(wx * 0.013 + 1.7) * 18 * amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround() {
    var g = ctx.createLinearGradient(0, GROUND, 0, H);
    g.addColorStop(0, '#1b2340');
    g.addColorStop(1, C.ground);
    ctx.fillStyle = g;
    ctx.fillRect(0, GROUND, W, H - GROUND);

    // 深渊
    for (var gi = 0; gi < gaps.length; gi++) {
      var gx = gaps[gi].x - camX, gw = gaps[gi].w;
      if (gx > W || gx + gw < 0) continue;
      var dg = ctx.createLinearGradient(0, GROUND, 0, H);
      dg.addColorStop(0, 'rgba(5,8,18,.2)');
      dg.addColorStop(1, 'rgba(2,4,10,1)');
      ctx.fillStyle = dg;
      ctx.fillRect(gx, GROUND, gw, H - GROUND);
    }

    // 顶部发光边（断口处不画）
    ctx.save();
    ctx.shadowColor = 'rgba(126,231,255,.75)';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = C.groundEdge;
    ctx.lineWidth = 3;
    ctx.beginPath();
    var step = 10;
    var startX = Math.floor(camX / step) * step;
    var pen = false;
    for (var x = startX; x < camX + W + step; x += step) {
      var sx = x - camX;
      if (groundAt(x + 5)) {
        if (!pen) { ctx.moveTo(sx, GROUND + 1); pen = true; }
        else ctx.lineTo(sx, GROUND + 1);
      } else pen = false;
    }
    ctx.stroke();
    ctx.restore();

    // 地面纹理
    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = '#7ee7ff';
    ctx.lineWidth = 1;
    for (var gx2 = -((camX * 0.6) % 60); gx2 < W; gx2 += 60) {
      ctx.beginPath();
      ctx.moveTo(gx2, GROUND + 14);
      ctx.lineTo(gx2 - 24, H);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacle(o) {
    var sx = o.x - camX;
    if (sx > W + 60 || sx + o.w < -60) return;
    if (o.kind === 'stone') {
      var g = ctx.createLinearGradient(sx, o.y, sx, o.y + o.h);
      g.addColorStop(0, '#aab6cc'); g.addColorStop(1, C.stoneD);
      fillRR(sx, o.y, o.w, o.h, Math.min(10, o.w / 5), g);
      strokeRR(sx, o.y, o.w, o.h, Math.min(10, o.w / 5), 'rgba(255,255,255,.28)', 1.4);
      ctx.globalAlpha = 0.25; ctx.fillStyle = '#fff';
      fillRR(sx + 6, o.y + 6, o.w * 0.4, 5, 3, '#fff');
      ctx.globalAlpha = 1;
    } else {
      var g2 = ctx.createLinearGradient(sx, o.y, sx, o.y + o.h);
      g2.addColorStop(0, '#e0a366'); g2.addColorStop(1, C.crateD);
      fillRR(sx, o.y, o.w, o.h, Math.min(8, o.w / 6), g2);
      strokeRR(sx, o.y, o.w, o.h, Math.min(8, o.w / 6), 'rgba(60,30,10,.5)', 1.6);
      ctx.strokeStyle = 'rgba(90,50,20,.45)';
      ctx.lineWidth = 1.6;
      for (var i = 1; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + 5, o.y + (o.h / 3) * i);
        ctx.lineTo(sx + o.w - 5, o.y + (o.h / 3) * i);
        ctx.stroke();
      }
    }
  }

  function drawCoin(c) {
    var sx = c.x - camX;
    if (sx < -30 || sx > W + 30) return;
    var bob = Math.sin(time * 4 + c.x * 0.01) * 3;
    var cx = sx, cy = c.y + bob;
    ctx.save();
    ctx.shadowColor = 'rgba(255,209,102,.7)';
    ctx.shadowBlur = 14;
    var g = ctx.createRadialGradient(cx - 3, cy - 4, 1, cx, cy, 12);
    g.addColorStop(0, '#fff6cf'); g.addColorStop(0.6, C.coin); g.addColorStop(1, C.coinD);
    ctx.fillStyle = g;
    circle(cx, cy, 11); ctx.fill();
    ctx.restore();
    strokeRR(cx - 3.5, cy - 6, 7, 12, 3, 'rgba(255,255,255,.55)', 1.4);
  }

  function drawPickup(pu) {
    var sx = pu.x - camX;
    if (sx < -60 || sx > W + 60) return;
    var bob = pu.ground ? Math.sin(pu.t * 6) * 1.5 : Math.sin(pu.t * 3) * 5;
    var cy = pu.y + bob;
    var col = pu.kind === 'star' ? C.star : (pu.kind === 'magnet' ? C.magnet :
      (pu.kind === 'shield' ? C.shield : (pu.kind === 'slow' ? C.slow : (pu.kind === 'counter' ? '#ff8a4d' : C.dbl))));
    var label = pu.kind === 'star' ? '无敌' : (pu.kind === 'magnet' ? '磁铁' :
      (pu.kind === 'shield' ? '护盾' : (pu.kind === 'slow' ? '缓速' : (pu.kind === 'counter' ? '反击' : '双倍'))));

    // 外圈光晕
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = 26;
    ctx.globalAlpha = 0.22 + 0.1 * Math.sin(time * 4);
    ctx.fillStyle = col;
    circle(sx, cy, 24); ctx.fill();
    ctx.restore();

    // 玻璃球
    var g = ctx.createRadialGradient(sx - 6, cy - 8, 2, sx, cy, 22);
    g.addColorStop(0, 'rgba(255,255,255,.55)');
    g.addColorStop(0.35, 'rgba(255,255,255,.16)');
    g.addColorStop(1, 'rgba(255,255,255,.05)');
    ctx.fillStyle = g;
    circle(sx, cy, 21); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1.6;
    circle(sx, cy, 21); ctx.stroke();

    // 图标
    if (pu.kind === 'star') {
      ctx.fillStyle = col;
      starPath(sx, cy, 11, 5);
      ctx.fill();
    } else if (pu.kind === 'magnet') {
      ctx.strokeStyle = col;
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(sx, cy + 2, 8, Math.PI, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx - 8, cy + 2); ctx.lineTo(sx - 8, cy + 8);
      ctx.moveTo(sx + 8, cy + 2); ctx.lineTo(sx + 8, cy + 8);
      ctx.stroke();
    } else if (pu.kind === 'shield') {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(sx, cy - 11);
      ctx.lineTo(sx + 10, cy - 6);
      ctx.lineTo(sx + 8, cy + 5);
      ctx.quadraticCurveTo(sx, cy + 13, sx - 8, cy + 5);
      ctx.lineTo(sx - 10, cy - 6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.65)';
      ctx.fillRect(sx - 1.5, cy - 6, 3, 12);
      ctx.fillRect(sx - 6, cy - 2, 12, 3);
    } else if (pu.kind === 'slow') {
      ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(sx, cy, 9, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, cy - 5); ctx.lineTo(sx, cy); ctx.lineTo(sx + 5, cy + 4); ctx.stroke();
    } else if (pu.kind === 'counter') {
      // 小火箭图标
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(sx, cy - 11);
      ctx.quadraticCurveTo(sx + 8, cy - 2, sx + 5, cy + 7);
      ctx.lineTo(sx - 5, cy + 7);
      ctx.quadraticCurveTo(sx - 8, cy - 2, sx, cy - 11);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff3d6';
      ctx.beginPath(); ctx.arc(sx, cy - 2, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.moveTo(sx - 5, cy + 7); ctx.lineTo(sx, cy + 13); ctx.lineTo(sx + 5, cy + 7); ctx.closePath(); ctx.fill();
    } else {
      text('×2', sx, cy + 1, 15, col, 'center', 800);
    }
    // 名称
    ctx.save();
    ctx.font = '700 10px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.shadowColor = 'rgba(0,0,0,.6)';
    ctx.shadowBlur = 6;
    ctx.fillText(label, sx, cy + 32);
    ctx.restore();
  }
  function starPath(cx, cy, outer, inner) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var r = i % 2 ? inner : outer;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawMobs() {
    for (var i = 0; i < mobs.length; i++) {
      var m = mobs[i], r = mobRect(m);
      var sx = r.x - camX;
      if (sx > W + 80 || sx + r.w < -80) continue;
      if (m.kind === 'slime') drawSlime(m, r, sx);
      else if (m.kind === 'walker') drawWalker(m, r, sx);
      else drawFlyer(m, r, sx);
    }
  }
  function drawSlime(m, r, sx) {
    if (m.dead && m.deadT > 0.32) return;
    var squash = m.dead ? Math.max(0.2, 1 - m.deadT * 3) : 1 + Math.sin(m.t * 8) * 0.06;
    var w = m.w * squash, h = m.h * (2 - squash);
    var cx = sx + m.w / 2, base = m.baseY - 4;
    ctx.save();
    if (m.dead) ctx.globalAlpha = Math.max(0, 1 - m.deadT * 3);
    // 影子
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(cx, m.baseY + 2, w * 0.42, 4, 0, 0, Math.PI * 2); ctx.fill();
    // 身体
    var g = ctx.createLinearGradient(cx, base - h, cx, base);
    g.addColorStop(0, C.slimeL); g.addColorStop(0.45, C.slime); g.addColorStop(1, C.slimeD);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, base);
    ctx.bezierCurveTo(cx - w / 2, base - h * 1.25, cx + w / 2, base - h * 1.25, cx + w / 2, base);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(10,60,40,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.ellipse(cx - w * 0.18, base - h * 0.72, w * 0.14, h * 0.12, -0.5, 0, Math.PI * 2); ctx.fill();
    // 生气的眼睛
    if (!m.dead) {
      ctx.fillStyle = '#0f2a1e';
      circle(cx - w * 0.2, base - h * 0.55, 3.4); ctx.fill();
      circle(cx + w * 0.2, base - h * 0.55, 3.4); ctx.fill();
      ctx.strokeStyle = '#0f2a1e'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.34, base - h * 0.78); ctx.lineTo(cx - w * 0.1, base - h * 0.68);
      ctx.moveTo(cx + w * 0.34, base - h * 0.78); ctx.lineTo(cx + w * 0.1, base - h * 0.68);
      ctx.stroke();
      // 小尖牙
      ctx.fillStyle = '#eafff6';
      ctx.beginPath(); ctx.moveTo(cx - 4, base - 6); ctx.lineTo(cx - 1, base - 2); ctx.lineTo(cx + 2, base - 6); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawWalker(m, r, sx) {
    if (m.dead && m.deadT > 0.3) return;
    var bob = m.dead ? 0 : Math.sin(m.t * 9) * 2.4;
    var x = sx, y = r.y + bob, w = m.w, h = m.h;
    ctx.save();
    if (m.dead) ctx.globalAlpha = Math.max(0, 1 - m.deadT * 3);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(x + w / 2, m.baseY + 2, w * 0.4, 4, 0, 0, Math.PI * 2); ctx.fill();
    // 腿
    var lp = Math.sin(m.t * 12);
    ctx.strokeStyle = C.walkerD; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + w * 0.32, y + h); ctx.lineTo(x + w * 0.28 + lp * 4, y + h + 7);
    ctx.moveTo(x + w * 0.68, y + h); ctx.lineTo(x + w * 0.72 - lp * 4, y + h + 7);
    ctx.stroke();
    // 身体
    var g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, C.walkerL); g.addColorStop(0.5, C.walker); g.addColorStop(1, C.walkerD);
    ctx.fillStyle = g;
    rr(x, y, w, h, 11); ctx.fill();
    ctx.strokeStyle = 'rgba(90,10,35,.4)'; ctx.lineWidth = 1.6; ctx.stroke();
    // 触角
    ctx.strokeStyle = C.walkerD; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x + w * 0.5, y + 2); ctx.lineTo(x + w * 0.5, y - 9); ctx.stroke();
    circle(x + w * 0.5, y - 11, 3.4); ctx.fillStyle = '#ffd166'; ctx.fill();
    if (!m.dead) {
      // 眼睛 + 怒眉
      ctx.fillStyle = '#2a0716';
      circle(x + w * 0.34, y + h * 0.45, 3.6); ctx.fill();
      circle(x + w * 0.66, y + h * 0.45, 3.6); ctx.fill();
      ctx.strokeStyle = '#2a0716'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.2, y + h * 0.28); ctx.lineTo(x + w * 0.44, y + h * 0.36);
      ctx.moveTo(x + w * 0.8, y + h * 0.28); ctx.lineTo(x + w * 0.56, y + h * 0.36);
      ctx.stroke();
      // 嘴
      ctx.beginPath();
      ctx.moveTo(x + w * 0.36, y + h * 0.68); ctx.lineTo(x + w * 0.5, y + h * 0.76); ctx.lineTo(x + w * 0.64, y + h * 0.68);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawFlyer(m, r, sx) {
    if (m.dead && m.deadT > 0.3) return;
    var flap = Math.sin(m.t * 13 + m.phase);
    var cx = sx + m.w / 2, cy = r.y + m.h / 2 + (m.dead ? m.deadT * 90 : 0);
    ctx.save();
    if (m.dead) ctx.globalAlpha = Math.max(0, 1 - m.deadT * 3);
    // 翅膀
    ctx.fillStyle = C.flyerD;
    ctx.beginPath();
    ctx.moveTo(cx - 6, cy - 1);
    ctx.quadraticCurveTo(cx - 30, cy - 16 - flap * 10, cx - 26, cy + 6);
    ctx.quadraticCurveTo(cx - 16, cy + 2, cx - 6, cy + 6);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 6, cy - 1);
    ctx.quadraticCurveTo(cx + 30, cy - 16 + flap * 10, cx + 26, cy + 6);
    ctx.quadraticCurveTo(cx + 16, cy + 2, cx + 6, cy + 6);
    ctx.closePath(); ctx.fill();
    // 身体
    var g = ctx.createRadialGradient(cx - 4, cy - 5, 2, cx, cy, 16);
    g.addColorStop(0, C.flyerL); g.addColorStop(1, C.flyerD);
    ctx.fillStyle = g;
    circle(cx, cy, 13); ctx.fill();
    ctx.strokeStyle = 'rgba(40,10,80,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    if (!m.dead) {
      // 发光眼
      ctx.fillStyle = '#ffd166';
      circle(cx - 4.5, cy - 1, 2.6); ctx.fill();
      circle(cx + 4.5, cy - 1, 2.6); ctx.fill();
      ctx.strokeStyle = '#2a0a4a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy - 4); ctx.lineTo(cx - 2.5, cy - 2.5);
      ctx.moveTo(cx + 8, cy - 4); ctx.lineTo(cx + 2.5, cy - 2.5);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawBoss() {
    if (!boss) return;
    var B = boss, x = B.x - camX, y = B.y, w = B.w, h = B.h;
    var bob = Math.sin(B.t * 3.4) * 3;
    ctx.save();
    if (B.dying > 0) ctx.globalAlpha = Math.max(0.15, B.dying / 0.75);
    // 底部悬浮光
    var bg = ctx.createRadialGradient(x + w / 2, y + h + 26, 4, x + w / 2, y + h + 26, 70);
    bg.addColorStop(0, 'rgba(167,139,250,.45)');
    bg.addColorStop(1, 'rgba(167,139,250,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(x + w / 2, y + h + 26, 70, 22, 0, 0, Math.PI * 2); ctx.fill();
    // 角
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.moveTo(x + 8, y + 20); ctx.lineTo(x + 2, y - 8); ctx.lineTo(x + 22, y + 12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + w - 8, y + 20); ctx.lineTo(x + w - 2, y - 8); ctx.lineTo(x + w - 22, y + 12); ctx.closePath(); ctx.fill();
    // 身体
    var g = ctx.createLinearGradient(x, y + bob, x, y + h + bob);
    g.addColorStop(0, C.bossL); g.addColorStop(0.5, B.hitFlash > 0 ? '#ffffff' : C.boss); g.addColorStop(1, C.bossD);
    ctx.fillStyle = g;
    rr(x, y + 12 + bob, w, h - 12, 22); ctx.fill();
    ctx.strokeStyle = 'rgba(30,10,60,.55)'; ctx.lineWidth = 2; ctx.stroke();
    // 眼睛
    if (B.dying <= 0) {
      ctx.save();
      ctx.shadowColor = C.bossEye; ctx.shadowBlur = 18;
      ctx.fillStyle = B.hitFlash > 0 ? '#ffffff' : C.bossEye;
      circle(x + w * 0.30, y + 34 + bob, 8); ctx.fill();
      circle(x + w * 0.70, y + 34 + bob, 8); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#2a0010';
      circle(x + w * 0.30, y + 34 + bob, 3.2); ctx.fill();
      circle(x + w * 0.70, y + 34 + bob, 3.2); ctx.fill();
      // 怒眉
      ctx.strokeStyle = '#2a0010'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + w * 0.16, y + 20 + bob); ctx.lineTo(x + w * 0.40, y + 27 + bob);
      ctx.moveTo(x + w * 0.84, y + 20 + bob); ctx.lineTo(x + w * 0.60, y + 27 + bob);
      ctx.stroke();
    }
    // 嘴
    ctx.fillStyle = '#1a0626';
    rr(x + w * 0.22, y + 56 + bob, w * 0.56, 16, 7); ctx.fill();
    ctx.fillStyle = '#ffffff';
    for (var t = 0; t < 4; t++) {
      ctx.beginPath();
      ctx.moveTo(x + w * 0.26 + t * 11, y + 56 + bob);
      ctx.lineTo(x + w * 0.30 + t * 11, y + 63 + bob);
      ctx.lineTo(x + w * 0.34 + t * 11, y + 56 + bob);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawPlayer() {
    var cx = PX + PS / 2, cy = p.y - PS / 2;
    if (p.onGround) {
      ctx.fillStyle = 'rgba(0,0,0,.26)';
      ctx.beginPath(); ctx.ellipse(cx, GROUND, PS * 0.46, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (inv > 0) {
      ctx.save();
      ctx.shadowColor = C.star; ctx.shadowBlur = 30;
      ctx.globalAlpha = 0.3 + 0.2 * Math.sin(time * 16);
      ctx.fillStyle = C.star;
      rr(cx - PS / 2 - 6, cy - PS / 2 - 6, PS + 12, PS + 12, 18); ctx.fill();
      ctx.restore();
    }
    if (combo >= 3) {
      ctx.save();
      ctx.globalAlpha = 0.15 + 0.1 * Math.sin(time * 10);
      ctx.fillStyle = C.glow;
      rr(cx - PS / 2 - 5, cy - PS / 2 - 5, PS + 10, PS + 10, 17); ctx.fill();
      ctx.restore();
    }
    if (whaleImg && whaleImg.complete && whaleImg.naturalWidth) {
      ctx.save();
      ctx.translate(cx, cy);
      if (!p.onGround) ctx.rotate(p.rot * 0.6);
      var sqI = p.squash;
      ctx.scale(1 / sqI, sqI);
      var wI = 60, hI = 44;
      ctx.drawImage(whaleImg, -wI / 2, -hI / 2, wI, hI);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(cx, cy);
    if (!p.onGround) ctx.rotate(p.rot * 0.6);
    var sq = p.squash;
    ctx.scale(1 / sq, sq);
    var half = PS / 2;
    var wig = Math.sin(time * 7) * 3;

    // 尾鳍（身后摆动）
    ctx.fillStyle = C.whaleD;
    ctx.beginPath();
    ctx.moveTo(-half + 6, 1);
    ctx.quadraticCurveTo(-half - 9, -10 + wig, -half - 15, 0 + wig * 0.6);
    ctx.quadraticCurveTo(-half - 9, 3 + wig * 0.3, -half + 6, 9);
    ctx.closePath(); ctx.fill();

    // 背鳍
    ctx.fillStyle = C.whaleD;
    ctx.beginPath();
    ctx.moveTo(-3, -half * 0.62);
    ctx.quadraticCurveTo(2, -half - 9, 9, -half * 0.5);
    ctx.closePath(); ctx.fill();

    // 圆滚滚的身体
    var g = ctx.createLinearGradient(-half, -half, half, half);
    g.addColorStop(0, C.whaleL);
    g.addColorStop(0.5, C.whale);
    g.addColorStop(1, C.whaleD);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(1, 2, half * 1.04, half * 0.94, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(16,26,70,.4)'; ctx.lineWidth = 2; ctx.stroke();

    // 白肚皮
    ctx.fillStyle = C.whaleBelly;
    ctx.beginPath();
    ctx.ellipse(3, 10, half * 0.6, half * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // 侧鳍（跳跃时拍打）
    var flap = Math.sin(time * (p.onGround ? 8 : 16)) * (p.onGround ? 1.5 : 5);
    ctx.fillStyle = C.whaleD;
    ctx.beginPath();
    ctx.ellipse(-half * 0.5, 12 + flap, 7, 4, 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(half * 0.95, 10 - flap, 6, 3.6, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // 眼睛（圆亮，眼神稳）
    var blink = Math.sin(time * 2.2) > 0.975;
    if (blink) {
      ctx.strokeStyle = '#0d1b3f'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-9.5, -3); ctx.lineTo(-3.5, -3);
      ctx.moveTo(5.5, -3); ctx.lineTo(11.5, -3);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#0d1b3f';
      circle(-6.5, -3.5, 3.9); ctx.fill();
      circle(8.5, -3.5, 3.9); ctx.fill();
      ctx.fillStyle = '#ffffff';
      circle(-7.8, -5, 1.5); ctx.fill();
      circle(7.2, -5, 1.5); ctx.fill();
    }
    // 小微笑
    ctx.strokeStyle = '#0d1b3f'; ctx.lineWidth = 2.1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(1, 5, 4.6, 0.16 * Math.PI, 0.84 * Math.PI); ctx.stroke();

    // 头顶小水花（跳跃时）
    if (!p.onGround || Math.sin(time * 3) > 0.6) {
      ctx.fillStyle = C.spout;
      ctx.globalAlpha = 0.85;
      circle(6, -half - 6, 2.4); ctx.fill();
      circle(11, -half - 12, 1.8); ctx.fill();
      circle(2, -half - 11, 1.6); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
  function GREUND_SAFE() { return GROUND; }

  function drawTrail() {
    for (var i = 0; i < trail.length; i++) {
      var t = trail[i];
      ctx.globalAlpha = 0.12 * (t.life / t.max);
      ctx.save();
      ctx.translate(PX + PS / 2, t.y - PS / 2);
      ctx.rotate(t.rot);
      ctx.fillStyle = C.coral;
      rr(-PS / 2, -PS / 2, PS, PS, 13); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawRockets() {
    for (var i = 0; i < rockets.length; i++) {
      var rk = rockets[i];
      var ang = Math.atan2(-1, 1);
      ctx.save();
      ctx.translate(rk.x, rk.y);
      ctx.rotate(Math.sin(rk.t * 20) * 0.12);
      ctx.shadowColor = '#ff7a59'; ctx.shadowBlur = 22;
      var g = ctx.createLinearGradient(-16, 0, 12, 0);
      g.addColorStop(0, '#ffd166'); g.addColorStop(1, '#ff7a59');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(14, 0);
      ctx.quadraticCurveTo(2, -9, -10, -7);
      ctx.lineTo(-10, 7);
      ctx.quadraticCurveTo(2, 9, 14, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(3, 0, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawProjs() {
    for (var i = 0; i < projs.length; i++) {
      var pr = projs[i], sx = pr.x - camX;
      if (sx > W + 40 || sx < -40) continue;
      ctx.save();
      ctx.shadowColor = '#ff7a45'; ctx.shadowBlur = 22;
      var g = ctx.createRadialGradient(sx + 10, pr.y + 7, 2, sx + 10, pr.y + 7, 14);
      g.addColorStop(0, '#fff1b8'); g.addColorStop(0.5, '#ff9a4d'); g.addColorStop(1, '#e8501f');
      ctx.fillStyle = g;
      circle(sx + pr.w / 2, pr.y + pr.h / 2, 10); ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (var i = 0; i < parts.length; i++) {
      var q = parts[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, q.life / q.max));
      ctx.fillStyle = q.color;
      circle(q.x, q.y, q.r); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawRings() {
    for (var i = 0; i < rings.length; i++) {
      var r = rings[i];
      ctx.globalAlpha = Math.max(0, r.life / r.max) * 0.8;
      ctx.strokeStyle = r.color; ctx.lineWidth = 2;
      circle(r.x, r.y, r.r); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function drawTexts() {
    for (var i = 0; i < texts.length; i++) {
      var t = texts[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life / t.max));
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 8;
      text(t.s, t.x, t.y, t.size, t.color, 'center', 800);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    var scale = Math.min(cvs.width / W, cvs.height / H);
    var ox = (cvs.width - W * scale) / 2, oy = (cvs.height - H * scale) / 2;
    ctx.fillStyle = '#05070f';
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.setTransform(scale, 0, 0, scale, ox, oy);

    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawBackground();
    drawGround();
    for (var i = 0; i < obs.length; i++) drawObstacle(obs[i]);
    for (var c = 0; c < coinList.length; c++) if (!coinList[c].got) drawCoin(coinList[c]);
    for (var pu = 0; pu < pickups.length; pu++) if (!pickups[pu].got) drawPickup(pickups[pu]);
    drawMobs();
    drawBoss();
    drawProjs();
    drawRockets();
    drawTrail();
    drawPlayer();
    drawParticles();
    drawRings();
    drawTexts();

    if (flash > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.55).toFixed(3) + ')';
      ctx.fillRect(0, 0, cvs.width, cvs.height);
    }
  }

  // ================= 主循环 =================
  function frame(t) {
    var dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016;
    last = t;
    if (freeze > 0) {
      freeze = Math.max(0, freeze - dt);
      if (shake > 0) shake = Math.max(0, shake - dt * 34);
      if (flash > 0) flash = Math.max(0, flash - dt * 1.7);
      time += dt;
      draw();
      requestAnimationFrame(frame);
      return;
    }
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', function () { fitCanvas(); });

  // ================= 按钮事件 =================
  function bind(id, fn) {
    var node = $(id);
    if (!node || !node.addEventListener) return;
    node.addEventListener('click', function (ev) { if (ev && ev.stopPropagation) ev.stopPropagation(); fn(); });
  }
  bind('btnStart', function () { start(); });
  bind('btnRetry', function () { start(); });
  bind('btnShare', function () { shareScore(); });
  bind('btnBoard', function () { showBoard('over'); });
  bind('btnMenuBoard', function () { showBoard('menu'); });
  bind('btnBoardClose', function () { hideBoard(); });
  bind('btnMenuSound', function () {
    soundOn = !soundOn;
    if (el.soundBtn) el.soundBtn.textContent = soundOn ? '🔊' : '🔇';
    toast(soundOn ? '声音已开' : '声音已关');
    if (soundOn) beep(880, 0.08, 'sine', 0.05);
  });
  bind('tabLocal', function () { setTab(0); });
  bind('tabOnline', function () { setTab(1); if (ONLINE) loadOnline(); });
  if (el.soundBtn && el.soundBtn.addEventListener) {
    el.soundBtn.addEventListener('click', function (ev) {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      soundOn = !soundOn;
      el.soundBtn.textContent = soundOn ? '🔊' : '🔇';
      if (soundOn) beep(880, 0.08, 'sine', 0.05);
    });
  }
  if (el.tabOnline && !ONLINE) el.tabOnline.style.display = 'none';

  // ================= 测试钩子 =================
  window.__bj = {
    start: start, die: die, reset: reset, draw: draw, frame: frame, update: update,
    state: function () { return state; },
    world: function () { return { gaps: gaps, obs: obs, mobs: mobs, projs: projs, rockets: rockets, pickups: pickups, coins: coinList, camX: camX, speed: speed, trail: trail, parts: parts }; },
    boss: function () { return boss; },
    player: function () { return p; },
    power: function () { return { inv: inv, magnet: magnet, dbl: dbl, shield: shield, slow: slow }; },
    stats: function () { return { score: score, best: best, coins: coinsGot, kills: kills, combo: combo, maxCombo: maxCombo, dist: dist, rank: thisRank, name: playerName }; },
    board: function () { return { local: LB, online: onlineRows, state: onlineState, tab: boardTab, onlineOn: ONLINE }; },
    ui: {
      showMenu: showMenu, showOver: showOver, showBoard: showBoard, hideBoard: hideBoard,
      setTab: setTab, renderBoard: renderBoard, toast: toast, start: start
    },
    config: CONFIG, reason: function () { return deadReason; }, debugBoss: spawnBoss,
    debugPower: function (k) {
      if (k === 'shield') shield = 1;
      if (k === 'slow') slow = 6;
      if (k === 'inv') inv = 6;
      syncHud(true);
    },
    debugAbsorb: tryAbsorb
  };

  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
